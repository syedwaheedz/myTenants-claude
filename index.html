  const note = document.getElementById("ap-note").value.trim();
  const date = document.getElementById("ap-date").value || todayISO();
  const splits = apCollectReceivers(total_amount);

  const audit = await Repo.auditLogFor(id);
  const isAdj = txn.type === "ADJUSTMENT";
  const hasSettledSplit = splits.some(s=>s.settled_at);
  const canEdit = !txn.is_voided && (isAdj || !hasSettledSplit);
  document.getElementById("modal-root")?.remove();
  const root = document.createElement("div"); root.id="modal-root"; document.body.appendChild(root);
  root.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="sheet-handle"></div>
        <div class="modal-head"><h2>${isAdj?"Balance adjustment":"Payment detail"}</h2><button class="icon-btn" onclick="closeModal()">${ic("close")}</button></div>
        <div class="card">
          <div class="row"><div class="name">${esc(tenant?tenant.name:"—")}</div>${txn.is_voided?'<span class="chip due">Voided</span>':""}</div>
          <div class="meta">${fmtDate(txn.date)}</div>
          <div class="divider"></div>
          ${isAdj ? `
            <div class="row"><span class="meta">${txn.adjustment_amount>=0?"Added to balance":"Reduced from balance"}</span><span class="num">${fmtMoney(Math.abs(txn.adjustment_amount||0))}</span></div>
          ` : `
            <div class="row"><span class="meta">Amount received</span><span class="num">${fmtMoney(txn.total_amount)}</span></div>
            ${txn.repair_amount ? `<div class="row"><span class="meta">Repair deduction</span><span class="num">${fmtMoney(txn.repair_amount)}</span></div>` : ""}
          `}
          ${txn.note ? `<div class="row"><span class="meta">Note</span><span>${esc(txn.note)}</span></div>` : ""}
          ${txn.receipt ? `<div style="margin-top:8px;"><img src="${txn.receipt}" style="max-width:100%;border-radius:12px;"></div>` : ""}
        </div>
        ${splits.length ? `<div class="section-title">${ic("call_split")}Splits</div><div class="card">${splits.map(s=>`
          <div class="row"><span>${esc(rById[s.receiver_id]?rById[s.receiver_id].name:"—")}</span><span class="num">${fmtMoney(s.amount)}${s.settled_at?" · settled":""}</span></div>`).join("")}</div>` : ""}
        ${audit.length ? `<div class="section-title">${ic("history")}Audit history</div><div class="card">${audit.map(a=>`<div class="audit-row">${ic("info")}${a.action} · ${fmtDate(a.timestamp)}</div>`).join("")}</div>` : ""}
        ${!txn.is_voided && !isAdj && hasSettledSplit ? `<div class="warn-box" style="margin-top:12px;">${ic("info")}This payment's cash has already been settled with a partner, so it can't be edited — void it instead if it was a mistake.</div>` : ""}
        ${canEdit ? `<button class="btn secondary" style="margin-top:14px;" onclick="openEditTxn('${id}')">${ic("edit")}Edit this ${isAdj?"adjustment":"payment"}</button>` : ""}
        ${!txn.is_voided ? `<button class="btn danger" style="margin-top:8px;" onclick="voidTxnConfirm('${id}')">${ic("undo")}Void this ${isAdj?"adjustment":"transaction"}</button>` : ""}
        <button class="btn danger" style="margin-top:8px;background:#7a1210;" onclick="deleteTxnPermanentlyConfirm('${id}')">${ic("delete_forever")}Delete permanently (admin)</button>
      </div>
    </div>
  `;
}
async function openEditTxn(id){
  const txn = await get("transactions", id);
  if (!txn || txn.is_voided) return;
  if (txn.type === "ADJUSTMENT") return openEditAdjustment(id);
  return openEditPayment(id);
}
async function openEditPayment(id){
  const txn = await get("transactions", id);
  const splits = await Repo.splitsFor(id);
  if (splits.some(s=>s.settled_at)){
    toast("This payment's cash has already been settled — void it instead if it was a mistake.");
    return;
  }
  const tenant = await get("tenants", txn.tenant_id);
  const receivers = await Repo.allReceivers();
  const partners = await Repo.allPartners();
  const partnerById = Object.fromEntries(partners.map(p=>[p.id,p]));
  const isMulti = splits.length > 1;
  document.getElementById("modal-root")?.remove();
  const root = document.createElement("div"); root.id="modal-root"; document.body.appendChild(root);
  root._receivers = receivers;
  _apReceiptDataUrl = txn.receipt || null;
  root.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="sheet-handle"></div>
        <div class="modal-head"><h2>Edit payment</h2><button class="icon-btn" onclick="closeModal()">${ic("close")}</button></div>

        <div class="card"><div class="row"><span class="meta">Tenant</span><span class="name">${esc(tenant?tenant.name:"—")}</span></div></div>

        <label>Amount received</label>
        <input id="ap-amount" type="number" step="0.01" value="${txn.total_amount}" oninput="apRefreshSplitSum()">

        <label>Date</label>
        <input id="ap-date" type="date" value="${txn.date}">

        ${receiverPickerHtml(receivers, partnerById, {multi:isMulti, singleSelectedId: !isMulti && splits[0] ? splits[0].receiver_id : ""})}

        <div class="toggle-row">
          <div>Repair deduction</div>
          <label class="switch"><input id="ap-repair-toggle" type="checkbox" ${txn.repair_amount?"checked":""} onchange="apToggleRepair()"><span class="slider"></span></label>
        </div>
        <div id="ap-repair-fields" style="display:${txn.repair_amount?"block":"none"};">
          <label>Repair amount (credited to tenant, not counted as cash)</label>
          <input id="ap-repair-amount" type="number" step="0.01" value="${txn.repair_amount||0}">
          <label>Replace receipt photo (optional)</label>
          <input id="ap-receipt" type="file" accept="image/*" onchange="apReceiptChosen(event)">
          <div id="ap-receipt-chip">${txn.receipt?`<span class="file-chip">${ic("attach_file")}Current receipt kept unless replaced</span>`:""}</div>
        </div>

        <label>Note (optional)</label>
        <input id="ap-note" type="text" value="${esc(txn.note||"")}">

        <button class="btn" style="margin-top:16px;" onclick="submitEditPayment('${id}')">${ic("check")}Save changes</button>
      </div>
    </div>
  `;
  if (isMulti) splits.forEach(s => apAddSplitRow(s.receiver_id, s.amount));
  apRefreshSplitSum();
}
async function submitEditPayment(id){
  const total_amount = document.getElementById("ap-amount").value;
  if (!total_amount) return toast("Enter the amount received");
  const repairOn = document.getElementById("ap-repair-toggle").checked;
  const repair_amount = repairOn ? document.getElementById("ap-repair-amount").value : 0;
  const note = document.getElementById("ap-note").value.trim();
  const date = document.getElementById("ap-date").value || todayISO();
  const splits = apCollectReceivers(total_amount);
  try{
    await Repo.editRentPayment(id, {total_amount, repair_amount, note, receipt:_apReceiptDataUrl, date, splits});
    _apReceiptDataUrl = null;
    closeModal(); toast("Payment updated"); render();
  }catch(e){ toast(e.message); }
}
async function openEditAdjustment(id){
  const txn = await get("transactions", id);
  const tenant = await get("tenants", txn.tenant_id);
  document.getElementById("modal-root")?.remove();
  const root = document.createElement("div"); root.id="modal-root"; document.body.appendChild(root);
  root.innerHTML = modalShell("Edit adjustment", `
    <div class="card"><div class="row"><span class="meta">Tenant</span><span class="name">${esc(tenant?tenant.name:"—")}</span></div></div>
    <label>Amount</label>
    <input id="adj-amount" type="number" step="0.01" value="${txn.adjustment_amount}">
    <div class="meta" style="margin-top:2px;">Positive adds to what they owe, negative reduces it.</div>
    <label>Note (optional)</label>
    <input id="adj-note" type="text" value="${esc(txn.note||"")}">
    <label>Date</label>
    <input id="adj-date" type="date" value="${txn.date}">
    <button class="btn" style="margin-top:16px;" onclick="submitEditAdjustment('${id}')">${ic("check")}Save changes</button>
  `);
}
async function submitEditAdjustment(id){
  const amount = document.getElementById("adj-amount").value;
  if (!amount) return toast("Enter an amount");
  const note = document.getElementById("adj-note").value.trim();
  const date = document.getElementById("adj-date").value || todayISO();
  try{
    await Repo.editBalanceAdjustment(id, {amount, note, date});
    closeModal(); toast("Adjustment updated"); render();
  }catch(e){ toast(e.message); }
}
async function voidTxnConfirm(id){
  if (!confirm("Void this transaction? This reverses its effect on the tenant's balance and is logged in the audit trail.")) return;
  await Repo.voidTransaction(id);
  closeModal(); toast("Transaction voided"); render();
}
async function deleteTxnPermanentlyConfirm(id){
  const txn = await get("transactions", id);
  const isAdj = txn.type === "ADJUSTMENT";
  const amt = isAdj ? Math.abs(txn.adjustment_amount||0) : (txn.total_amount+txn.repair_amount);
  if (!confirm(`Delete this ${isAdj?"adjustment":"transaction"} (${fmtMoney(amt)}) permanently, including its audit history? This is different from voiding — there will be no record it ever existed. This cannot be undone.`)) return;
  await Repo.deleteTransactionPermanently(id);
  closeModal(); toast("Deleted permanently"); render();
}

function modalShell(title, inner){
  return `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <div class="sheet-handle"></div>
      <div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" onclick="closeModal()">${ic("close")}</button></div>
      ${inner}
    </div>
  </div>`;
}

// expose functions used via inline onclick handlers
Object.assign(window, {
  goTab, openPropertyTenants, openTenantLedger, openModal, closeModal, setTenantsViewMode,
  saveProperty, updatePropertySave, deletePropertyConfirm,
  saveTenant, updateTenantSave, deleteTenantConfirm, forceDeleteTenantConfirm, toggleArchiveTenant, submitAdjustBalance, requestPaymentViaWhatsApp,
  setRentChangeMode, refreshRentCorrectionPreview, submitCorrectRent, submitScheduleRent,
  savePartner, updatePartnerSave, removePartner,
  saveReceiver, removeReceiver, importBackup,
  openSnapshotModal, renderSnapshotPreview, downloadSnapshot, shareSnapshot,
  openMonthlyReportModal, exportMonthlyReportPdf,
  openAddPayment, apToggleRepair, apReceiptChosen, apShowMultiSplit, apShowSingleReceiver, apAddSplitRow, apRefreshSplitSum, submitAddPayment,
  openTxnDetail, openEditTxn, openEditPayment, submitEditPayment, openEditAdjustment, submitEditAdjustment, voidTxnConfirm, deleteTxnPermanentlyConfirm, submitSettlement, toggleTransferPaid, refreshTransferNote, Repo, State
});

// ---------- init ----------
(async function init(){
  await openDB();
  await Repo.runDueAccruals();
  render();
})();

// Register the service worker so the app shell works once installed, even
// with no signal. Registered relative to this file, so it works whether the
// app sits at a domain root or a GitHub Pages subpath.
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
