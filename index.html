<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>myTenants</title>
<meta name="theme-color" content="#2F6B5E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="myTenants">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-50..200&display=block" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<style>
  :root{
    /* ---- Material 3 tokens (custom teal seed) ---- */
    --md-primary:#2F6B5E;
    --md-on-primary:#FFFFFF;
    --md-primary-container:#B6ECDC;
    --md-on-primary-container:#00201A;
    --md-secondary-container:#DCE8E2;
    --md-on-secondary-container:#151E1B;
    --md-surface:#F6F8F6;
    --md-surface-1:#FFFFFF;
    --md-surface-variant:#DDE5E0;
    --md-on-surface:#191C1B;
    --md-on-surface-variant:#48504C;
    --md-outline:#79817D;
    --md-outline-variant:#E2E6E2;
    --md-error:#BA1A1A;
    --md-error-container:#FFDAD6;
    --md-on-error-container:#410002;
    --md-tertiary:#6F5D1E;
    --md-tertiary-container:#F6E1AC;
    --md-on-tertiary-container:#241A00;
    --md-success:#1E6E3C;
    --md-success-container:#D8F3DF;

    /* ---- logo pink: a subtle decorative accent only (topbar glow) —
       the functional UI color stays the teal seed above ---- */
    --brand-pink:#D50262;

    --shadow-1:0 1px 2px rgba(0,0,0,.24), 0 1px 3px 1px rgba(0,0,0,.12);
    --shadow-2:0 1px 2px rgba(0,0,0,.20), 0 3px 8px 1px rgba(0,0,0,.14);
    --shadow-3:0 4px 10px 2px rgba(0,0,0,.14), 0 2px 4px rgba(0,0,0,.22);

    /* ---- aliases used throughout the app's CSS ---- */
    --bg:var(--md-surface);
    --surface:var(--md-surface-1);
    --ink:var(--md-on-surface);
    --ink-soft:var(--md-on-surface-variant);
    --line:var(--md-outline-variant);
    --accent:var(--md-primary);
    --accent-ink:var(--md-on-primary-container);
    --accent-soft:var(--md-primary-container);
    --paid:var(--md-success);
    --paid-bg:var(--md-success-container);
    --due:var(--md-error);
    --due-bg:var(--md-error-container);
    --partial:var(--md-tertiary);
    --partial-bg:var(--md-tertiary-container);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .msi{
    font-family:'Material Symbols Outlined';
    font-weight:normal;font-style:normal;
    font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;
    display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;
    -webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;
    vertical-align:middle;
  }
  .num{font-variant-numeric:tabular-nums;}
  h1,h2,h3{margin:0 0 4px 0;font-weight:600;letter-spacing:.1px;}
  #app{
    max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);
    padding-bottom:92px;position:relative;
  }
  .topbar{
    position:sticky;top:0;z-index:5;background:var(--bg);
    padding:20px 16px 12px 16px;display:flex;align-items:center;justify-content:space-between;
    overflow:hidden;
  }
  /* subtle logo-pink wash — the one deliberate nod to the logo's brand
     color; everything else in the app stays the teal seed */
  .topbar::before{
    content:"";position:absolute;top:-40px;left:-30px;width:180px;height:140px;
    background:radial-gradient(closest-side, var(--brand-pink) 0%, transparent 75%);
    opacity:.10;pointer-events:none;
  }
  .topbar > *{position:relative;}
  .topbar h1{font-size:20px;color:var(--ink);}
  .topbar .sub{color:var(--ink-soft);font-size:13px;}
  .icon-btn{
    background:var(--surface);border:none;border-radius:50%;
    width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink);box-shadow:var(--shadow-1);flex-shrink:0;
    transition:transform .08s ease;
  }
  .icon-btn:active{transform:scale(.92);}
  .icon-btn.spinning .msi{animation:spin .7s linear infinite;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .content{padding:4px 16px 24px 16px;}

  /* ---- Cards (Material elevated card) ---- */
  .card{
    background:var(--surface);border:none;border-radius:var(--radius);
    padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-1);
    transition:box-shadow .12s ease, transform .08s ease;
  }
  .card.tap{cursor:pointer;}
  .card.tap:active{transform:scale(.99);box-shadow:var(--shadow-1);}
  .chart-card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow-1);}
  .chart-card .chead{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .chart-card .chart-title{font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:2px;}
  .chart-card .chart-sub{font-size:12px;color:var(--ink-soft);}
  .chart-empty{color:var(--ink-soft);font-size:13px;text-align:center;padding:20px 0;}

  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .row + .row{margin-top:6px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-1);}
  .stat .top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .stat .label{color:var(--ink-soft);font-size:12.5px;margin-bottom:2px;}
  .stat .value{font-size:20px;font-weight:700;}
  /* shared icon badge — was .stat-only (.ic-badge), now also used by
     chart-card headers so every Dashboard card reads as one family */
  .card-icon,.stat .ic-badge{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .section-title{font-size:13px;font-weight:600;color:var(--ink-soft);margin:20px 2px 10px 2px;display:flex;align-items:center;gap:6px;}

  /* ---- rent-collected progress card + status pills ---- */
  .progress-card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow-1);}
  .progress-card.tap{cursor:pointer;}
  .progress-card.tap:active{opacity:.85;}
  .progress-card .phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;}
  .progress-card .ptitle{display:flex;align-items:center;gap:10px;min-width:0;}
  .progress-card .ptitle .t{font-size:13.5px;font-weight:600;color:var(--ink);}
  .progress-card .ptitle .s{font-size:12px;color:var(--ink-soft);}
  .progress-card .pct{font-size:22px;font-weight:800;color:var(--paid);font-variant-numeric:tabular-nums;flex-shrink:0;}
  .progress-track{height:14px;border-radius:99px;background:var(--md-surface-variant);overflow:hidden;}
  .progress-fill{height:100%;border-radius:99px;background:var(--paid);}
  .glance-strip{display:flex;gap:8px;margin-bottom:14px;}
  .glance-pill{flex:1;background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow-1);text-align:center;cursor:pointer;}
  .glance-pill .n{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
  .glance-pill .l{font-size:10.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-top:1px;}

  /* ---- list-in-card: replaces one full card per row for Top defaulters /
     Partner balances / Recent activity, cutting scroll length ---- */
  .list-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-1);overflow:hidden;margin-bottom:10px;}
  .list-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}
  .list-row.tap{cursor:pointer;}
  .list-row.tap:active{opacity:.7;}
  .list-row .lr-main{flex:1;min-width:0;}
  .list-row .amt{font-weight:700;flex-shrink:0;}
  .list-row .chevron{color:var(--ink-soft);flex-shrink:0;}
  .view-all-row{display:flex;align-items:center;justify-content:center;gap:4px;padding:11px;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;background:var(--surface);}

  .chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap;}
  .chip.paid{background:var(--paid-bg);color:var(--paid);}
  .chip.due{background:var(--due-bg);color:var(--due);}
  .chip.partial{background:var(--partial-bg);color:var(--partial);}
  .chip.neutral{background:var(--accent-soft);color:var(--accent-ink);}
  .chip .msi{font-size:14px;}

  .name{font-weight:600;font-size:15px;}
  .meta{color:var(--ink-soft);font-size:13px;margin-top:2px;}
  .empty{text-align:center;color:var(--ink-soft);padding:40px 16px;border:1.5px dashed var(--line);border-radius:var(--radius);}
  .empty .msi{font-size:32px;color:var(--md-outline);margin-bottom:8px;}
  .empty .big{font-size:15px;color:var(--ink);margin-bottom:4px;font-weight:600;}

  /* ---- Buttons (Material filled / tonal / outlined) ---- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent);color:var(--md-on-primary);border:none;border-radius:20px;
    padding:12px 20px;font-size:14.5px;font-weight:600;cursor:pointer;width:100%;
    font-family:inherit;transition:transform .08s ease, box-shadow .12s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:var(--accent-soft);color:var(--accent-ink);}
  .btn.danger{background:var(--due);color:#fff;}
  .btn.small{width:auto;padding:8px 14px;font-size:13px;}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--md-outline-variant);}
  .link-btn{background:none;border:none;color:var(--accent);font-size:13.5px;font-weight:600;cursor:pointer;padding:4px 2px;font-family:inherit;display:inline-flex;align-items:center;gap:4px;}
  .link-btn.danger-link{color:var(--due);}

  /* ---- Extended FAB ---- */
  .fab-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;width:100%;max-width:488px;display:flex;justify-content:flex-end;padding:0 16px;pointer-events:none;z-index:6;}
  .fab-btn{
    pointer-events:auto;background:var(--accent-soft);color:var(--accent-ink);border:none;
    display:inline-flex;align-items:center;gap:8px;padding:16px 22px 16px 18px;border-radius:18px;
    box-shadow:var(--shadow-3);font-weight:600;font-size:14.5px;cursor:pointer;font-family:inherit;
    transition:transform .08s ease;
  }
  .fab-btn:active{transform:scale(.96);}

  label{display:block;font-size:13px;color:var(--ink-soft);margin:14px 0 5px 0;font-weight:500;}
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{
    width:100%;padding:12px 14px;border:1.5px solid var(--md-outline-variant);border-radius:12px;
    font-size:14.5px;background:var(--surface);color:var(--ink);font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  .field-row{display:flex;gap:10px;}
  .field-row > div{flex:1;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;}
  .switch{position:relative;width:44px;height:26px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:var(--md-outline-variant);border-radius:24px;transition:.15s;cursor:pointer;}
  .slider:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:var(--shadow-1);}
  input:checked + .slider{background:var(--accent);}
  input:checked + .slider:before{transform:translateX(18px);}
  .split-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .split-row select{flex:2;}
  .split-row input{flex:1;}
  .split-sum{font-size:13px;color:var(--ink-soft);margin-top:2px;font-weight:500;}
  .split-sum.ok{color:var(--paid);}
  .split-sum.bad{color:var(--due);}

  /* ---- Bottom navigation (Material 3 nav bar) ---- */
  .tabs{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;
    background:var(--surface);box-shadow:var(--shadow-2);display:flex;z-index:10;
    padding:10px 6px calc(6px + env(safe-area-inset-bottom)) 6px;
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:2px 2px;color:var(--ink-soft);cursor:pointer;font-size:11px;font-weight:500;
    background:none;border:none;font-family:inherit;
  }
  .tab .ic-wrap{padding:5px 20px;border-radius:16px;transition:background .12s ease;display:flex;}
  .tab.active{color:var(--ink);font-weight:700;}
  .tab.active .ic-wrap{background:var(--accent-soft);color:var(--accent-ink);}

  /* ---- Bottom sheet modal ---- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,24,22,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s ease;}
  .modal{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom)) 16px;box-shadow:var(--shadow-3);animation:slideUp .18s cubic-bezier(.2,.7,.3,1);}
  .sheet-handle{width:32px;height:4px;background:var(--md-outline-variant);border-radius:4px;margin:2px auto 14px auto;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .modal-head h2{font-size:18px;}
  .back-btn{background:none;border:none;color:var(--accent);font-size:14.5px;font-weight:600;cursor:pointer;padding:6px 0;font-family:inherit;display:inline-flex;align-items:center;gap:4px;}
  @keyframes slideUp{from{transform:translateY(28px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  .divider{height:1px;background:var(--line);margin:14px 0;}
  .ledger-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .ledger-row:last-child{border-bottom:none;}
  .ledger-row .l1{color:var(--ink-soft);font-size:12.5px;}
  .ledger-row.tap{cursor:pointer;}
  .ledger-row.tap:active{opacity:.7;}
  .ledger-row .chevron{color:var(--ink-soft);flex-shrink:0;}
  .audit-row{font-size:12.5px;color:var(--ink-soft);padding:7px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;}
  .warn-box{background:var(--partial-bg);color:var(--partial);border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start;}
  .toast{
    position:fixed;bottom:104px;left:50%;transform:translateX(-50%);
    background:#2E312F;color:#fff;padding:11px 18px;border-radius:8px;font-size:13.5px;
    z-index:40;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;box-shadow:var(--shadow-2);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .file-chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:7px 11px;font-size:13px;margin-top:6px;}

  /* ---- Legend for donut/bar charts ---- */
  .legend{display:flex;flex-direction:column;gap:7px;margin-top:12px;}
  .legend-item{display:flex;align-items:center;justify-content:space-between;font-size:13px;}
  .legend-item .lk{display:flex;align-items:center;gap:8px;color:var(--ink);}
  .legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .chart-flex{display:flex;align-items:center;gap:18px;}
  .chart-flex .legend{flex:1;margin-top:0;}

  /* ---- Segmented control (Overall / This month toggle) ---- */
  .segmented{display:flex;background:var(--md-surface-variant);border-radius:12px;padding:3px;margin-bottom:12px;}
  .segmented button{flex:1;background:none;border:none;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:inherit;}
  .segmented button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1);}
  .month-summary{display:flex;gap:14px;font-size:13px;color:var(--ink-soft);margin:2px 2px 12px 2px;flex-wrap:wrap;}
  .month-summary b{color:var(--ink);}
  .snapshot-canvas-wrap{background:var(--md-surface-variant);border-radius:12px;padding:10px;margin-bottom:14px;display:flex;justify-content:center;}
  .snapshot-canvas-wrap canvas{width:100%;max-width:340px;height:auto;border-radius:8px;box-shadow:var(--shadow-2);}

  /* ---- Monthly report (print / PDF export) ----
     Hidden in the normal app UI; only shown to the browser's print engine.
     Every rule is scoped under #report-print-root so it can never bleed
     into the live app's own .card / .section-title / table styling. */
  #report-print-root{ display:none; }
  @media print{
    html, body{ background:#fff !important; }
    body *{ visibility:hidden; }
    #report-print-root, #report-print-root *{ visibility:visible; }
    #report-print-root{ display:block; position:absolute; top:0; left:0; width:100%; background:#fff; }
    @page{ size:A4; margin:16mm 16mm 20mm 16mm; }
  }
  #report-print-root{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#191C1B; font-size:10.5pt; line-height:1.4;
  }
  #report-print-root .r-page{ page-break-after:always; min-height:261mm; display:flex; flex-direction:column; }
  #report-print-root .r-page:last-child{ page-break-after:auto; }
  #report-print-root .r-header{ display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid #2F6B5E; padding-bottom:8px; margin-bottom:16px; }
  #report-print-root .r-brand{ display:flex; align-items:center; gap:8px; }
  #report-print-root .r-logo{ width:26px; height:26px; border-radius:7px; }
  #report-print-root .r-brand-name{ font-weight:700; font-size:13pt; color:#191C1B; }
  #report-print-root .r-doc-title{ text-align:right; }
  #report-print-root .r-doc-title .t1{ font-weight:700; font-size:11pt; }
  #report-print-root .r-doc-title .t2{ font-size:9pt; color:#6B6A64; }
  #report-print-root .r-footer{ margin-top:auto; padding-top:8mm; }
  #report-print-root .r-footer .inner{ width:100%; border-top:1px solid #E3E1DB; padding-top:6px; display:flex; justify-content:space-between; font-size:8pt; color:#9a9a95; }
  #report-print-root h1.r-cover-title{ font-size:22pt; margin:10mm 0 2px 0; }
  #report-print-root .r-cover-sub{ color:#6B6A64; font-size:11pt; margin-bottom:10mm; }
  #report-print-root .r-section-title{ font-size:12pt; font-weight:700; color:#2F6B5E; margin:14px 0 8px 0; padding-bottom:4px; border-bottom:1px solid #DCE8E2; }
  #report-print-root .r-stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:6mm; }
  #report-print-root .r-stat-box{ background:#F6F8F6; border:1px solid #E3E1DB; border-radius:8px; padding:10px 12px; }
  #report-print-root .r-stat-box .r-label{ font-size:8.5pt; color:#6B6A64; margin-bottom:3px; }
  #report-print-root .r-stat-box .r-value{ font-size:15pt; font-weight:700; }
  #report-print-root .r-stat-box .r-caption{ font-size:7.8pt; color:#8a8d85; margin-top:3px; }
  #report-print-root table{ width:100%; border-collapse:collapse; margin-bottom:6mm; font-size:9.5pt; }
  #report-print-root th{ text-align:left; background:#EAF2EF; color:#1E4A40; font-weight:700; padding:6px 8px; font-size:8.8pt; text-transform:uppercase; letter-spacing:.02em; }
  #report-print-root td{ padding:6px 8px; border-bottom:1px solid #EDEDE8; }
  #report-print-root tr:nth-child(even) td{ background:#FAFAF8; }
  #report-print-root td.r-num, #report-print-root th.r-num{ text-align:right; font-variant-numeric:tabular-nums; }
  #report-print-root .r-pill{ display:inline-block; padding:1.5px 7px; border-radius:10px; font-size:8pt; font-weight:700; }
  #report-print-root .r-pill.paid{ background:#DFF3E4; color:#1E6E3C; }
  #report-print-root .r-pill.partial{ background:#F6E1AC; color:#6F5D1E; }
  #report-print-root .r-pill.due{ background:#FBEAE6; color:#BA1A1A; }
  #report-print-root .r-row-total td{ font-weight:700; border-top:2px solid #DCE8E2; border-bottom:none; background:#fff; }
  #report-print-root .r-two-col{ display:flex; gap:8mm; }
  #report-print-root .r-two-col > div{ flex:1; }
  #report-print-root .r-chart-box{ border:1px solid #E3E1DB; border-radius:8px; padding:10px 12px; margin-bottom:6mm; }
  #report-print-root .r-chart-box .r-ct{ font-size:9.5pt; font-weight:700; margin-bottom:2px; }
  #report-print-root .r-chart-box .r-cs{ font-size:8.3pt; color:#6B6A64; margin-bottom:8px; }
  #report-print-root .r-note{ font-size:8.5pt; color:#6B6A64; font-style:italic; margin-top:-3mm; margin-bottom:5mm; }

</style>
