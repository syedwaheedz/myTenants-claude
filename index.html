    ${Object.entries(byProperty).map(([propName, rows])=>`
      <div class="section-title">${ic("apartment")}${esc(propName)}</div>
      <div class="list-card">
        ${rows.map(t=>`
          <div class="list-row" style="flex-direction:column;align-items:stretch;gap:8px;">
            <div class="lr-main">
              <div class="name">${esc(t.name)}</div>
              <div class="meta">Currently ${fmtMoney(t.current_balance||0)}</div>
            </div>
            <div style="display:flex;gap:8px;">
              <input id="bulk-adj-${t.id}" type="number" step="0.01" placeholder="Owed" style="flex:1;min-width:0;">
              <input id="bulk-pay-${t.id}" type="number" step="0.01" placeholder="Payment" style="flex:1;min-width:0;">
              <select id="bulk-receiver-${t.id}" style="flex:1.2;min-width:0;">
                <option value="">Receiver</option>
                ${receivers.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join("")}
              </select>
            </div>
          </div>`).join("")}
      </div>
    `).join("")}
    <button class="btn" style="margin-top:10px;" onclick="submitBulkSetup()">${ic("playlist_add")}Save all</button>
    <button class="btn ghost" style="margin-top:8px;" onclick="lockBulkSetupConfirm()">${ic("lock")}Lock this screen (done with one-time setup)</button>
  `;
  Shell("One-time setup", null, html);
};
async function submitBulkSetup(){
  const tenants = (await Repo.allTenantsWithProperty()).filter(t=>!t.archived);
  const date = document.getElementById("bulk-date").value || todayISO();
  const forMonth = document.getElementById("bulk-for-month")?.value || undefined;
  const rows = [];
  for (const t of tenants){
    const adjEl = document.getElementById(`bulk-adj-${t.id}`);
    const payEl = document.getElementById(`bulk-pay-${t.id}`);
    const receiverEl = document.getElementById(`bulk-receiver-${t.id}`);
    const adj = adjEl && adjEl.value ? Number(adjEl.value) : 0;
    const pay = payEl && payEl.value ? Number(payEl.value) : 0;
    const receiver_id = receiverEl && receiverEl.value ? receiverEl.value : null;
    if (adj || pay) rows.push({tenant: t, adj, pay, receiver_id});
  }
  if (!rows.length) return toast("Enter at least one opening balance or payment");
  const adjCount = rows.filter(r=>r.adj).length;
  const payCount = rows.filter(r=>r.pay).length;
  const total = rows.reduce((s,r)=>s+Math.abs(r.adj)+Math.abs(r.pay), 0);
  const proceed = confirm(`Record ${adjCount} opening balance${adjCount===1?"":"s"} and ${payCount} payment${payCount===1?"":"s"}, ${fmtMoney(total)} total?\n\nThis creates real ledger entries — each one can be edited or voided afterward like any other, but this bulk pass itself can't be undone as a whole.`);
  if (!proceed) return;
  for (const {tenant, adj, pay, receiver_id} of rows){
    if (adj) await Repo.recordBalanceAdjustment({tenant_id: tenant.id, amount: adj, note: "Bulk setup entry — opening balance", date});
    if (pay) await Repo.recordRentPayment({tenant_id: tenant.id, total_amount: pay, date, for_month: forMonth, splits: receiver_id ? [{receiver_id, amount: pay}] : []});
  }
  toast(`Saved ${adjCount + payCount} entries`);
  goTab("partners");
}

  await syncMetaSet("bulk_setup_locked", true);
  toast("Locked");
  render();
}

  await syncMetaSet("bulk_setup_locked", false);

}

  document.getElementById("rc-tab-correct").classList.toggle("active", mode==="correct");
  document.getElementById("rc-tab-schedule").classList.toggle("active", mode==="schedule");
  document.getElementById("rc-correct-fields").style.display = mode==="correct" ? "block":"none";
  document.getElementById("rc-schedule-fields").style.display = mode==="schedule" ? "block":"none";

async function refreshRentCorrectionPreview(tenantId){
  const el = document.getElementById("rc-correct-preview"); if(!el) return;
  const t = await get("tenants", tenantId);
  const newRate = Number(document.getElementById("rc-correct-amount").value)||0;
  const currentRate = rentRateForMonth(t, monthKey());
  const history = (t.rent_history && t.rent_history.length) ? t.rent_history : [{effective_month: monthKey(t.start_date), rent: t.monthly_rent||0}];
  const last = history[history.length-1];
  const accrualEnd = t.last_accrual_month || monthKey();
  const months = last.effective_month <= accrualEnd ? monthsBetween(last.effective_month, accrualEnd) + 1 : 0;
  const delta = (newRate - currentRate) * months;
  if (Math.round(delta*100) === 0){ el.textContent = ""; return; }
  el.textContent = `${delta>0?"Adds":"Removes"} ${fmtMoney(Math.abs(delta))} ${delta>0?"to":"from"} their balance — ${months} month${months===1?"":"s"} already charged at ${fmtMoney(currentRate)}/mo.`;
}

function cssVar(name, fallback){ const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return v || fallback; }

async function drawSnapshotCanvas(canvas, data){
  try{ await document.fonts.ready; }catch(e){}
  const W = 1080;
  const margin = 56;
  const gap = 36;
  const colW = (W - margin*2 - 20) / 2;
  const primary = cssVar('--md-primary', '#2F6B5E');
  const onPrimary = '#ffffff';
  const ink = cssVar('--md-on-surface', '#191C1B');
  const inkSoft = cssVar('--md-on-surface-variant', '#48504C');
  const surfaceVariant = cssVar('--md-surface-variant', '#DDE5E0');
  const line = cssVar('--md-outline-variant', '#E2E6E2');

  const headerH = 200, statsH = 300, propRowH = 84, propHeaderH = 60, footerH = 90;
  const propsH = data.byProperty.length ? propHeaderH + data.byProperty.length*propRowH : 0;
  const H = headerH + gap + statsH + gap + propsH + gap + footerH;

  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = primary;
  ctx.fillRect(0,0,W,headerH);
  ctx.fillStyle = onPrimary;
  ctx.font = "700 52px Roboto, sans-serif";
  ctx.fillText("myTenants", margin, 96);
  ctx.font = "500 32px Roboto, sans-serif";
  ctx.globalAlpha = 0.92;
  ctx.fillText(fmtMonth(data.mk) + " summary", margin, 148);
  ctx.globalAlpha = 1;

  let y = headerH + gap;
  function statTile(x, yy, w, h, label, value){
    ctx.fillStyle = surfaceVariant;
    roundRectPath(ctx, x, yy, w, h, 18);
    ctx.fill();
    ctx.fillStyle = inkSoft;
    ctx.font = "500 22px Roboto, sans-serif";
    ctx.fillText(label, x+24, yy+40);
    ctx.fillStyle = ink;
    ctx.font = "700 40px Roboto, sans-serif";
    ctx.fillText(value, x+24, yy+h-28);
  }
  const tileH = (statsH - 20) / 2;
  statTile(margin, y, colW, tileH, "Collected this month", fmtMoney(data.collected));
  statTile(margin+colW+20, y, colW, tileH, "Arrears as of month end", fmtMoney(data.arrears));
  statTile(margin, y+tileH+20, colW, tileH, "Cash in hand (unsettled)", fmtMoney(data.cashTotal));
  statTile(margin+colW+20, y+tileH+20, colW, tileH, "Tenants paid", `${data.paidCount} / ${data.totalTenants}`);
  y += statsH + gap;

  if (data.byProperty.length){
    ctx.fillStyle = ink;
    ctx.font = "700 30px Roboto, sans-serif";
    ctx.fillText("By property", margin, y+8);
    y += propHeaderH;
    for (const p of data.byProperty){
      ctx.strokeStyle = line;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(margin, y+propRowH-1); ctx.lineTo(W-margin, y+propRowH-1); ctx.stroke();

      ctx.fillStyle = ink;
      ctx.font = "600 30px Roboto, sans-serif";
      ctx.fillText(truncateCanvasText(ctx, p.property.name, W - margin*2 - 260), margin, y+38);

      ctx.fillStyle = inkSoft;
      ctx.font = "400 22px Roboto, sans-serif";
      ctx.fillText(`${p.paid} paid · ${p.partial} partial · ${p.due} due`, margin, y+70);

      ctx.textAlign = 'right';
      ctx.fillStyle = ink;
      ctx.font = "700 30px Roboto, sans-serif";
      ctx.fillText(fmtMoney(p.collected), W-margin, y+44);
      ctx.textAlign = 'left';

      y += propRowH;
    }
  }

  ctx.fillStyle = inkSoft;
  ctx.font = "400 20px Roboto, sans-serif";
  ctx.textAlign = 'center';
  ctx.fillText(`Generated ${fmtDate(todayISO())} · myTenants`, W/2, H-36);
  ctx.textAlign = 'left';
}
function roundRectPath(ctx,x,y,w,h,r){
  if (ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); return; }
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function truncateCanvasText(ctx, text, maxWidth){
  if (ctx.measureText(text).width <= maxWidth) return text;
  let t = text;
  while (t.length>1 && ctx.measureText(t+"…").width > maxWidth) t = t.slice(0,-1);
  return t + "…";
}

async function buildMonthlyReportData(mk){
  const [collected, cashRows, monthlyStatuses, portfolio, trend, defaulters, partnerSettlement, transfersAll] = await Promise.all([
    Repo.totalCollectedForMonth(mk), Repo.cashInHandByReceiver(), Repo.monthlyStatusForAllTenants(mk),
    Repo.portfolioTotals(), Repo.monthlyCollections(6, mk), Repo.defaultersAsOf(mk),
    Repo.reportPartnerSettlementSummary(mk), Repo.transferHistory()
  ]);
  const outstandingTotal = defaulters.reduce((s,t)=>s+t.current_balance,0);
  const cashTotal = cashRows.reduce((s,r)=>s+r.amount,0);
  const paidCount = monthlyStatuses.filter(s=>s.status==="paid").length;
  const partialCount = monthlyStatuses.filter(s=>s.status==="partial").length;
  const dueCount = monthlyStatuses.filter(s=>s.status==="due").length;

  const byPropMap = {};
  for (const t of defaulters){
    const key = t.property ? t.property.name : "Unknown property";
    byPropMap[key] = (byPropMap[key]||0) + t.current_balance;
  }
  const outstandingByProperty = Object.entries(byPropMap).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value);

  const propMap = {};
  for (const row of monthlyStatuses){
    const pname = row.property ? row.property.name : "Unknown property";
    (propMap[pname] ||= []).push(row);
  }
  const propertyDetail = Object.entries(propMap)
    .map(([name, rows]) => ({ name, rows: rows.sort((a,b)=>a.tenant.name.localeCompare(b.tenant.name)) }))
    .sort((a,b)=>a.name.localeCompare(b.name));

  const transfersThisPeriod = transfersAll.filter(t=>t.period===mk);

  return { mk, collected, outstandingTotal, cashTotal, cashRows, paidCount, partialCount, dueCount, portfolio, trend, defaulters, outstandingByProperty, propertyDetail, partnerSettlement, transfersThisPeriod };
}

async function exportMonthlyReportPdf(){
  const fromMk = document.getElementById("report-from-month").value || monthKey();
  const toMk = document.getElementById("report-to-month")?.value || fromMk;
  if (toMk < fromMk) return toast("'To' month must be on or after 'From' month");
  State.reportFromMonth = fromMk;
  State.reportToMonth = toMk;
  const months = [];
  for (let mk = fromMk; mk <= toMk; mk = addMonths(mk, 1)) months.push(mk);
  let html = "";
  for (const mk of months){
    const data = await buildMonthlyReportData(mk);
    html += buildMonthlyReportHtml(data, months.length > 1);
  }
  document.getElementById("report-print-root").innerHTML = html;
  closeModal();
  setTimeout(() => {
    // Android's WebView never implements window.print() (silent no-op) —
    // use the NativePrint plugin's Android PrintManager bridge instead.
    const jobName = fromMk === toMk ? `myTenants-${fromMk}` : `myTenants-${fromMk}_to_${toMk}`;
    if (isNativeApp()) window.Capacitor.Plugins.NativePrint.print({ jobName });
    else window.print();
  }, 150);
}

// =====================================================================
// Cloud sync (Supabase) — entirely additive. Local-first: every write
// already lands in IndexedDB immediately via put()/del() above, online
// or offline. This layer only drains the sync_outbox queue those two
// functions fill, and pulls down anything newer from Supabase, once
// signed in. Never signing in leaves the app exactly as it's always
// been — pure local storage.
//
// "org" = the shared dataset a signed-in user's data lives under. For
// this pass, org_id defaults to the signing-in user's own uid (a
// personal workspace) — a memberships table is still used and seeded
// with that self-row, so a real invite flow can extend this later
// without changing the sync/RLS model, just who else gets added.
// =====================================================================
const SUPABASE_URL = "https://jaisbkvgyrcqnsurctnk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_l4tyjmIE2MIyTESwawLa7A_HO8tFwXp";

let _supabaseClient = null;
function supabaseClient(){
  if (!_supabaseClient && window.supabase) _supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return _supabaseClient;
}
async function syncMetaGet(key){ const row = await get("sync_meta", key); return row ? row.value : null; }
function syncMetaSet(key, value){ return tx("sync_meta","readwrite", s => s.put({key, value})); }

async function ensureMembership(userId){
  const sb = supabaseClient();
  const { data } = await sb.from("memberships").select("org_id").eq("user_id", userId).limit(1);
  if (!data || !data.length) await sb.from("memberships").insert({ user_id: userId, org_id: userId });
}

// The app's real public URL — used as the auth redirect target instead of
// window.location.href when running natively, since inside the Android
// WebView that's https://localhost/index.html, an address that only means
// something inside the app's own sandbox and that no external browser (or
// the mail app opening the link) can ever reach. The Android App Link
// intent-filter (AndroidManifest.xml) is what routes a tap on this exact
// URL into the installed app instead of a browser.
const APP_PUBLIC_URL = "https://syedwaheedz.github.io/myTenants-claude/";
async function signInWithEmail(email){
  const sb = supabaseClient();
  if (!sb) throw new Error("Cloud sync isn't available right now — check your connection and try again.");
  const redirectTo = isNativeApp() ? APP_PUBLIC_URL : window.location.href;
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: redirectTo } });
  if (error) throw error;
}
async function signOutSync(){
  const sb = supabaseClient();
  if (sb) await sb.auth.signOut();
  await syncMetaSet("org_id", null);
  await syncMetaSet("user_email", null);
}
async function currentSyncSession(){
  const sb = supabaseClient();
  if (!sb) return null;
  const { data } = await sb.auth.getUser();
  return data && data.user ? data.user : null;
}

// Drains queued local changes up to Supabase, oldest first. Stops (rather
// than skipping) on the first failure so a transient network error doesn't
// silently drop entries out of order — it'll retry the same entry next pass.
async function pushOutbox(){
  const orgId = await syncMetaGet("org_id");
  const sb = supabaseClient();
  if (!orgId || !sb) return;
  const entries = await getAll("sync_outbox");
  for (const entry of entries){
    try{
      if (entry.op === "delete"){
        const { error } = await sb.from(entry.store).delete().eq("id", entry.id).eq("org_id", orgId);
        if (error) throw error;
      } else {
        const row = await get(entry.store, entry.id);
        if (row){
          const { error } = await sb.from(entry.store).upsert({ id: row.id, org_id: orgId, data: row, updated_at: row.updatedAt || nowIso() });
          if (error) throw error;
        }
      }
      await tx("sync_outbox","readwrite", s => s.delete(entry.seq));
    } catch(e){
      console.error("pushOutbox: stopped on", entry, e);
      break;
    }
  }
}

// Pulls anything changed remotely since each store's last-seen cursor and
// merges it into IndexedDB directly via tx() (not put()/del()) — applying
// a remote change must not re-queue it as a local change to push back up.
async function pullRemote(){
  const orgId = await syncMetaGet("org_id");
  const sb = supabaseClient();
  if (!orgId || !sb) return;
  for (const store of STORES){
    const cursorKey = "cursor:" + store;
    const cursor = (await syncMetaGet(cursorKey)) || "1970-01-01T00:00:00.000Z";
    const { data, error } = await sb.from(store).select("id, data, updated_at, deleted")
      .eq("org_id", orgId).gt("updated_at", cursor).order("updated_at", { ascending: true });
    if (error){ console.error("pullRemote failed for", store, error); continue; }
    if (!data || !data.length) continue;
    for (const row of data){
      if (row.deleted) await tx(store,"readwrite", s => s.delete(row.id));
      else await tx(store,"readwrite", s => s.put({ ...row.data, id: row.id, updatedAt: row.updated_at }));
    }
    await syncMetaSet(cursorKey, data[data.length-1].updated_at);
  }
}

let _syncing = false;
async function syncNow(){
  if (_syncing) return;
  _syncing = true;
  try{
    await pushOutbox();
    await pullRemote();
    await syncMetaSet("last_synced_at", nowIso());
  } catch(e){ console.error("sync failed", e); }
  finally{ _syncing = false; }
  if (State.tab === "partners") render();
}

async function initSync(){
  const sb = supabaseClient();
  if (!sb) return; // offline on first load, or the CDN script didn't load — sync just stays off
  const user = await currentSyncSession();
  if (user){
    await ensureMembership(user.id);
    await syncMetaSet("org_id", user.id);
    await syncMetaSet("user_email", user.email);
    await syncNow();
    render();
  }
  window.addEventListener("online", syncNow);
  setInterval(syncNow, 45000);
}

// Android App Link handler: the manifest's intent-filter routes a tap on
// https://syedwaheedz.github.io/myTenants-claude/* straight into this app
// (instead of the browser) — Capacitor delivers that as an "appUrlOpen"
// event rather than a normal page load, so supabase-js's own auto
// session-detection (which only looks at window.location on boot) never
// sees it. Parse the incoming URL for the auth tokens/code by hand and
// hand them to supabase-js directly.
function setupDeepLinkAuth(){
  if (!isNativeApp() || !window.Capacitor.Plugins.App) return;
  window.Capacitor.Plugins.App.addListener("appUrlOpen", async (event) => {
    const sb = supabaseClient();
    if (!sb || !event.url) return;
    try{
      const url = new URL(event.url);
      const hashParams = new URLSearchParams(url.hash.replace(/^#/, ""));
      const access_token = hashParams.get("access_token");
      const refresh_token = hashParams.get("refresh_token");
      const code = url.searchParams.get("code");
      if (access_token && refresh_token) await sb.auth.setSession({ access_token, refresh_token });
      else if (code) await sb.auth.exchangeCodeForSession(code);
      else return; // not an auth deep link
      await initSync();
      render();
      toast("Signed in");
    } catch(e){ console.error("deep link auth failed", e); }
  });
}

// ---------- init ----------
(async function init(){
  await openDB();
  await Repo.runDueAccruals();
  render();
  setupDeepLinkAuth();
  initSync();
})();
