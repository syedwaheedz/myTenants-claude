<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>myTenants</title>
<meta name="theme-color" content="#2F6B5E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="myTenants">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-50..200&display=block" rel="stylesheet">
<style>
  :root{
    /* ---- Material 3 tokens (custom teal seed) ---- */
    --md-primary:#2F6B5E;
    --md-on-primary:#FFFFFF;
    --md-primary-container:#B6ECDC;
    --md-on-primary-container:#00201A;
    --md-secondary-container:#DCE8E2;
    --md-on-secondary-container:#151E1B;
    --md-surface:#F6F8F6;
    --md-surface-1:#FFFFFF;
    --md-surface-variant:#DDE5E0;
    --md-on-surface:#191C1B;
    --md-on-surface-variant:#48504C;
    --md-outline:#79817D;
    --md-outline-variant:#E2E6E2;
    --md-error:#BA1A1A;
    --md-error-container:#FFDAD6;
    --md-on-error-container:#410002;
    --md-tertiary:#6F5D1E;
    --md-tertiary-container:#F6E1AC;
    --md-on-tertiary-container:#241A00;
    --md-success:#1E6E3C;
    --md-success-container:#D8F3DF;

    --shadow-1:0 1px 2px rgba(0,0,0,.24), 0 1px 3px 1px rgba(0,0,0,.12);
    --shadow-2:0 1px 2px rgba(0,0,0,.20), 0 3px 8px 1px rgba(0,0,0,.14);
    --shadow-3:0 4px 10px 2px rgba(0,0,0,.14), 0 2px 4px rgba(0,0,0,.22);

    /* ---- aliases used throughout the app's CSS ---- */
    --bg:var(--md-surface);
    --surface:var(--md-surface-1);
    --ink:var(--md-on-surface);
    --ink-soft:var(--md-on-surface-variant);
    --line:var(--md-outline-variant);
    --accent:var(--md-primary);
    --accent-ink:var(--md-on-primary-container);
    --accent-soft:var(--md-primary-container);
    --paid:var(--md-success);
    --paid-bg:var(--md-success-container);
    --due:var(--md-error);
    --due-bg:var(--md-error-container);
    --partial:var(--md-tertiary);
    --partial-bg:var(--md-tertiary-container);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .msi{
    font-family:'Material Symbols Outlined';
    font-weight:normal;font-style:normal;
    font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;
    display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;
    -webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;
    vertical-align:middle;
  }
  .num{font-variant-numeric:tabular-nums;}
  h1,h2,h3{margin:0 0 4px 0;font-weight:600;letter-spacing:.1px;}
  #app{
    max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);
    padding-bottom:92px;position:relative;
  }
  .topbar{
    position:sticky;top:0;z-index:5;background:var(--bg);
    padding:20px 16px 12px 16px;display:flex;align-items:center;justify-content:space-between;
  }
  .topbar h1{font-size:20px;color:var(--ink);}
  .topbar .sub{color:var(--ink-soft);font-size:13px;}
  .icon-btn{
    background:var(--surface);border:none;border-radius:50%;
    width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink);box-shadow:var(--shadow-1);flex-shrink:0;
    transition:transform .08s ease;
  }
  .icon-btn:active{transform:scale(.92);}
  .content{padding:4px 16px 24px 16px;}

  /* ---- Cards (Material elevated card) ---- */
  .card{
    background:var(--surface);border:none;border-radius:var(--radius);
    padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-1);
    transition:box-shadow .12s ease, transform .08s ease;
  }
  .card.tap{cursor:pointer;}
  .card.tap:active{transform:scale(.99);box-shadow:var(--shadow-1);}
  .chart-card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow-1);}
  .chart-card .chart-title{font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:2px;}
  .chart-card .chart-sub{font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
  .chart-empty{color:var(--ink-soft);font-size:13px;text-align:center;padding:20px 0;}

  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .row + .row{margin-top:6px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-1);}
  .stat .top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .stat .ic-badge{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;}
  .stat .label{color:var(--ink-soft);font-size:12.5px;margin-bottom:2px;}
  .stat .value{font-size:20px;font-weight:700;}
  .section-title{font-size:13px;font-weight:600;color:var(--ink-soft);margin:20px 2px 10px 2px;display:flex;align-items:center;gap:6px;}

  .chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap;}
  .chip.paid{background:var(--paid-bg);color:var(--paid);}
  .chip.due{background:var(--due-bg);color:var(--due);}
  .chip.partial{background:var(--partial-bg);color:var(--partial);}
  .chip.neutral{background:var(--accent-soft);color:var(--accent-ink);}
  .chip .msi{font-size:14px;}

  .name{font-weight:600;font-size:15px;}
  .meta{color:var(--ink-soft);font-size:13px;margin-top:2px;}
  .empty{text-align:center;color:var(--ink-soft);padding:40px 16px;border:1.5px dashed var(--line);border-radius:var(--radius);}
  .empty .msi{font-size:32px;color:var(--md-outline);margin-bottom:8px;}
  .empty .big{font-size:15px;color:var(--ink);margin-bottom:4px;font-weight:600;}

  /* ---- Buttons (Material filled / tonal / outlined) ---- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent);color:var(--md-on-primary);border:none;border-radius:20px;
    padding:12px 20px;font-size:14.5px;font-weight:600;cursor:pointer;width:100%;
    font-family:inherit;transition:transform .08s ease, box-shadow .12s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:var(--accent-soft);color:var(--accent-ink);}
  .btn.danger{background:var(--due);color:#fff;}
  .btn.small{width:auto;padding:8px 14px;font-size:13px;}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--md-outline-variant);}
  .link-btn{background:none;border:none;color:var(--accent);font-size:13.5px;font-weight:600;cursor:pointer;padding:4px 2px;font-family:inherit;display:inline-flex;align-items:center;gap:4px;}
  .link-btn.danger-link{color:var(--due);}

  /* ---- Extended FAB ---- */
  .fab-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;width:100%;max-width:488px;display:flex;justify-content:flex-end;padding:0 16px;pointer-events:none;z-index:6;}
  .fab-btn{
    pointer-events:auto;background:var(--accent-soft);color:var(--accent-ink);border:none;
    display:inline-flex;align-items:center;gap:8px;padding:16px 22px 16px 18px;border-radius:18px;
    box-shadow:var(--shadow-3);font-weight:600;font-size:14.5px;cursor:pointer;font-family:inherit;
    transition:transform .08s ease;
  }
  .fab-btn:active{transform:scale(.96);}

  label{display:block;font-size:13px;color:var(--ink-soft);margin:14px 0 5px 0;font-weight:500;}
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{
    width:100%;padding:12px 14px;border:1.5px solid var(--md-outline-variant);border-radius:12px;
    font-size:14.5px;background:var(--surface);color:var(--ink);font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  .field-row{display:flex;gap:10px;}
  .field-row > div{flex:1;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;}
  .switch{position:relative;width:44px;height:26px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:var(--md-outline-variant);border-radius:24px;transition:.15s;cursor:pointer;}
  .slider:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:var(--shadow-1);}
  input:checked + .slider{background:var(--accent);}
  input:checked + .slider:before{transform:translateX(18px);}
  .split-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .split-row select{flex:2;}
  .split-row input{flex:1;}
  .split-sum{font-size:13px;color:var(--ink-soft);margin-top:2px;font-weight:500;}
  .split-sum.ok{color:var(--paid);}
  .split-sum.bad{color:var(--due);}

  /* ---- Bottom navigation (Material 3 nav bar) ---- */
  .tabs{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;
    background:var(--surface);box-shadow:var(--shadow-2);display:flex;z-index:10;
    padding:10px 6px calc(6px + env(safe-area-inset-bottom)) 6px;
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:2px 2px;color:var(--ink-soft);cursor:pointer;font-size:11px;font-weight:500;
    background:none;border:none;font-family:inherit;
  }
  .tab .ic-wrap{padding:5px 20px;border-radius:16px;transition:background .12s ease;display:flex;}
  .tab.active{color:var(--ink);font-weight:700;}
  .tab.active .ic-wrap{background:var(--accent-soft);color:var(--accent-ink);}

  /* ---- Bottom sheet modal ---- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,24,22,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s ease;}
  .modal{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom)) 16px;box-shadow:var(--shadow-3);animation:slideUp .18s cubic-bezier(.2,.7,.3,1);}
  .sheet-handle{width:32px;height:4px;background:var(--md-outline-variant);border-radius:4px;margin:2px auto 14px auto;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .modal-head h2{font-size:18px;}
  .back-btn{background:none;border:none;color:var(--accent);font-size:14.5px;font-weight:600;cursor:pointer;padding:6px 0;font-family:inherit;display:inline-flex;align-items:center;gap:4px;}
  @keyframes slideUp{from{transform:translateY(28px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  .divider{height:1px;background:var(--line);margin:14px 0;}
  .ledger-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .ledger-row:last-child{border-bottom:none;}
  .ledger-row .l1{color:var(--ink-soft);font-size:12.5px;}
  .audit-row{font-size:12.5px;color:var(--ink-soft);padding:7px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;}
  .warn-box{background:var(--partial-bg);color:var(--partial);border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start;}
  .toast{
    position:fixed;bottom:104px;left:50%;transform:translateX(-50%);
    background:#2E312F;color:#fff;padding:11px 18px;border-radius:8px;font-size:13.5px;
    z-index:40;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;box-shadow:var(--shadow-2);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .file-chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:7px 11px;font-size:13px;margin-top:6px;}

  /* ---- Legend for donut/bar charts ---- */
  .legend{display:flex;flex-direction:column;gap:7px;margin-top:12px;}
  .legend-item{display:flex;align-items:center;justify-content:space-between;font-size:13px;}
  .legend-item .lk{display:flex;align-items:center;gap:8px;color:var(--ink);}
  .legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .chart-flex{display:flex;align-items:center;gap:18px;}
  .chart-flex .legend{flex:1;margin-top:0;}

  /* ---- Segmented control (Overall / This month toggle) ---- */
  .segmented{display:flex;background:var(--md-surface-variant);border-radius:12px;padding:3px;margin-bottom:12px;}
  .segmented button{flex:1;background:none;border:none;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:inherit;}
  .segmented button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1);}
  .month-summary{display:flex;gap:14px;font-size:13px;color:var(--ink-soft);margin:2px 2px 12px 2px;flex-wrap:wrap;}
  .month-summary b{color:var(--ink);}
  .snapshot-canvas-wrap{background:var(--md-surface-variant);border-radius:12px;padding:10px;margin-bottom:14px;display:flex;justify-content:center;}
  .snapshot-canvas-wrap canvas{width:100%;max-width:340px;height:auto;border-radius:8px;box-shadow:var(--shadow-2);}

  /* ---- Monthly report (print / PDF export) ----
     Hidden in the normal app UI; only shown to the browser's print engine.
     Every rule is scoped under #report-print-root so it can never bleed
     into the live app's own .card / .section-title / table styling. */
  #report-print-root{ display:none; }
  @media print{
    html, body{ background:#fff !important; }
    body *{ visibility:hidden; }
    #report-print-root, #report-print-root *{ visibility:visible; }
    #report-print-root{ display:block; position:absolute; top:0; left:0; width:100%; background:#fff; }
    @page{ size:A4; margin:16mm 16mm 20mm 16mm; }
  }
  #report-print-root{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#191C1B; font-size:10.5pt; line-height:1.4;
  }
  #report-print-root .r-page{ page-break-after:always; min-height:261mm; display:flex; flex-direction:column; }
  #report-print-root .r-page:last-child{ page-break-after:auto; }
  #report-print-root .r-header{ display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid #2F6B5E; padding-bottom:8px; margin-bottom:16px; }
  #report-print-root .r-brand{ display:flex; align-items:center; gap:8px; }
  #report-print-root .r-logo{ width:26px; height:26px; border-radius:7px; }
  #report-print-root .r-brand-name{ font-weight:700; font-size:13pt; color:#191C1B; }
  #report-print-root .r-doc-title{ text-align:right; }
  #report-print-root .r-doc-title .t1{ font-weight:700; font-size:11pt; }
  #report-print-root .r-doc-title .t2{ font-size:9pt; color:#6B6A64; }
  #report-print-root .r-footer{ margin-top:auto; padding-top:8mm; }
  #report-print-root .r-footer .inner{ width:100%; border-top:1px solid #E3E1DB; padding-top:6px; display:flex; justify-content:space-between; font-size:8pt; color:#9a9a95; }
  #report-print-root h1.r-cover-title{ font-size:22pt; margin:10mm 0 2px 0; }
  #report-print-root .r-cover-sub{ color:#6B6A64; font-size:11pt; margin-bottom:10mm; }
  #report-print-root .r-section-title{ font-size:12pt; font-weight:700; color:#2F6B5E; margin:14px 0 8px 0; padding-bottom:4px; border-bottom:1px solid #DCE8E2; }
  #report-print-root .r-stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:6mm; }
  #report-print-root .r-stat-box{ background:#F6F8F6; border:1px solid #E3E1DB; border-radius:8px; padding:10px 12px; }
  #report-print-root .r-stat-box .r-label{ font-size:8.5pt; color:#6B6A64; margin-bottom:3px; }
  #report-print-root .r-stat-box .r-value{ font-size:15pt; font-weight:700; }
  #report-print-root .r-stat-box .r-caption{ font-size:7.8pt; color:#8a8d85; margin-top:3px; }
  #report-print-root table{ width:100%; border-collapse:collapse; margin-bottom:6mm; font-size:9.5pt; }
  #report-print-root th{ text-align:left; background:#EAF2EF; color:#1E4A40; font-weight:700; padding:6px 8px; font-size:8.8pt; text-transform:uppercase; letter-spacing:.02em; }
  #report-print-root td{ padding:6px 8px; border-bottom:1px solid #EDEDE8; }
  #report-print-root tr:nth-child(even) td{ background:#FAFAF8; }
  #report-print-root td.r-num, #report-print-root th.r-num{ text-align:right; font-variant-numeric:tabular-nums; }
  #report-print-root .r-pill{ display:inline-block; padding:1.5px 7px; border-radius:10px; font-size:8pt; font-weight:700; }
  #report-print-root .r-pill.paid{ background:#DFF3E4; color:#1E6E3C; }
  #report-print-root .r-pill.partial{ background:#F6E1AC; color:#6F5D1E; }
  #report-print-root .r-pill.due{ background:#FBEAE6; color:#BA1A1A; }
  #report-print-root .r-row-total td{ font-weight:700; border-top:2px solid #DCE8E2; border-bottom:none; background:#fff; }
  #report-print-root .r-two-col{ display:flex; gap:8mm; }
  #report-print-root .r-two-col > div{ flex:1; }
  #report-print-root .r-chart-box{ border:1px solid #E3E1DB; border-radius:8px; padding:10px 12px; margin-bottom:6mm; }
  #report-print-root .r-chart-box .r-ct{ font-size:9.5pt; font-weight:700; margin-bottom:2px; }
  #report-print-root .r-chart-box .r-cs{ font-size:8.3pt; color:#6B6A64; margin-bottom:8px; }
  #report-print-root .r-note{ font-size:8.5pt; color:#6B6A64; font-style:italic; margin-top:-3mm; margin-bottom:5mm; }
  #report-print-root .r-callout{ background:#FBF1DD; border:1px solid #F0DCA8; border-radius:8px; padding:8px 10px; font-size:9pt; margin-bottom:5mm; }
  #report-print-root .r-empty{ color:#8a8d85; font-size:9pt; font-style:italic; margin-bottom:5mm; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="report-print-root"></div>

<script>
/* =========================================================================
   myTenants — Web build
   Backend  : IndexedDB local data layer + Repository (business rules)
   Frontend : Material-style, card-based UI with SVG dashboard charts
   Mirrors the schema and rules in architecture-flow-design.md.
   ========================================================================= */

const DB_NAME = "mytenants";
const DB_VERSION = 2;
const STORES = ["properties","tenants","partners","receivers","transactions","transaction_splits","partner_settlements","partner_transfers","audit_log"];
const PALETTE = ["#2F6B5E","#B3402A","#9A6B00","#3B6EA5","#7E57C2","#4B635B","#C2410C","#0E7490"];

// ---------- tiny helpers ----------
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2));
const todayISO = () => new Date().toISOString().slice(0,10);
const monthKey = (d) => (d || todayISO()).slice(0,7); // "YYYY-MM"
const fmtMoney = (n) => "₹" + (Math.round((n||0)*100)/100).toLocaleString("en-IN", {minimumFractionDigits: 0, maximumFractionDigits: 2});
const fmtMonth = (mk) => { if(!mk) return "—"; const [y,m]=mk.split("-"); return new Date(y, m-1, 1).toLocaleDateString("en-IN",{month:"short",year:"numeric"}); };
const fmtMonthShort = (mk) => { const [y,m]=mk.split("-"); return new Date(y, m-1, 1).toLocaleDateString("en-IN",{month:"short"}); };
const fmtDate = (d) => d ? new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}) : "—";
const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const addMonths = (mk, n) => { const [y,m]=mk.split("-").map(Number); const d=new Date(y, m-1+n, 1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
const monthsBetween = (a,b) => { const [ay,am]=a.split("-").map(Number); const [by,bm]=b.split("-").map(Number); return (by-ay)*12+(bm-am); };
// A tenant's rent can change over time (a correction, or a scheduled increase).
// rent_history is a list of {effective_month, rent} sorted ascending; a month's
// rate is whichever entry's effective_month is the latest one <= that month.
// Tenants created before this existed have no rent_history — fall back to a
// single implicit entry from their start month at their stored monthly_rent,
// which reproduces the old single-rate behavior exactly.
function rentRateForMonth(tenant, mk){
  const history = (tenant.rent_history && tenant.rent_history.length) ? tenant.rent_history : [{effective_month: monthKey(tenant.start_date), rent: tenant.monthly_rent||0}];
  let rate = history[0].rent;
  for (const h of history){ if (h.effective_month <= mk) rate = h.rent; else break; }
  return rate;
}

// ---------- tiny SVG chart helpers (no external chart library) ----------
function svgBarChart(data, opts={}){
  const w = opts.width || 320, h = opts.height || 150;
  const padBottom = 22, padTop = 16;
  const n = Math.max(1, data.length);
  const gap = 10;
  const barW = (w - gap*(n+1)) / n;
  const max = Math.max(1, ...data.map(d=>d.value));
  const color = opts.color || "#2F6B5E";
  const labelSize = 10, valueSize = 9.5;
  // Rough character-width heuristic (Roboto at this weight averages ~0.56em per
  // char) so long labels truncate to fit their bar's slot instead of spilling
  // into their neighbors — that spillover was the reported overlap.
  const truncateFor = (s, fontSize) => {
    const maxChars = Math.max(3, Math.floor((barW + gap - 4) / (fontSize*0.56)));
    return s.length > maxChars ? s.slice(0, maxChars-1) + "…" : s;
  };
  const bars = data.map((d,i)=>{
    const bh = Math.max(2, (d.value/max) * (h - padTop - padBottom));
    const x = gap + i*(barW+gap);
    const y = h - padBottom - bh;
    const showVal = d.value > 0 ? fmtMoney(d.value).replace("₹","") : "";
    return `<g>
      <rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="5" fill="${color}"><title>${esc(d.label)}: ${fmtMoney(d.value)}</title></rect>
      ${d.value>0 ? `<text x="${x+barW/2}" y="${y-5}" text-anchor="middle" font-size="${valueSize}" font-family="Roboto" fill="var(--ink-soft)">${esc(truncateFor(showVal, valueSize))}</text>` : ""}
      <text x="${x+barW/2}" y="${h-6}" text-anchor="middle" font-size="${labelSize}" font-family="Roboto" fill="var(--ink-soft)">${esc(truncateFor(d.label, labelSize))}<title>${esc(d.label)}</title></text>
    </g>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet">${bars}</svg>`;
}
function svgDonut(data, opts={}){
  const size = opts.size || 132, stroke = opts.stroke || 18;
  const total = data.reduce((s,d)=>s+d.value,0);
  const r = (size-stroke)/2, cx=size/2, cy=size/2;
  const c = 2*Math.PI*r;
  let offset = 0;
  const segs = total > 0 ? data.map((d,i)=>{
    const frac = d.value/total;
    const len = Math.max(0, frac*c - 1.5); // small gap between segments
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${PALETTE[i%PALETTE.length]}" stroke-width="${stroke}"
      stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="round"></circle>`;
    offset += frac*c;
    return seg;
  }).join("") : "";
  const centerLabel = opts.centerLabel || "";
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"></circle>
    ${segs}
    ${centerLabel ? `<text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="13" font-weight="700" font-family="Roboto" fill="var(--ink)">${esc(centerLabel)}</text>` : ""}
  </svg>`;
}
function chartLegend(data, opts={}){
  const total = data.reduce((s,d)=>s+d.value,0) || 1;
  return `<div class="legend">${data.map((d,i)=>`
    <div class="legend-item">
      <span class="lk"><span class="legend-dot" style="background:${PALETTE[i%PALETTE.length]}"></span>${esc(d.label)}</span>
      <span class="num" style="font-weight:600;">${opts.showPct ? Math.round(d.value/total*100)+"%" : fmtMoney(d.value)}</span>
    </div>`).join("")}</div>`;
}

// ---------- IndexedDB wrapper ----------
let _db = null;
function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      STORES.forEach(name => { if(!db.objectStoreNames.contains(name)) db.createObjectStore(name, {keyPath:"id"}); });
    };
    req.onsuccess = () => { _db = req.result; resolve(_db); };
    req.onerror = () => reject(req.error);
  });
}
function tx(store, mode, fn){
  return new Promise((resolve, reject) => {
    const t = _db.transaction(store, mode);
    const s = t.objectStore(store);
    const result = fn(s);
    t.oncomplete = () => resolve(result);
    t.onerror = () => reject(t.error);
  });
}
function getAll(store){ return new Promise((res,rej)=>{ const t=_db.transaction(store,"readonly"); const r=t.objectStore(store).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function get(store, id){ return new Promise((res,rej)=>{ const t=_db.transaction(store,"readonly"); const r=t.objectStore(store).get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); }); }
function put(store, obj){ return tx(store,"readwrite", s => s.put(obj)); }
function del(store, id){ return tx(store,"readwrite", s => s.delete(id)); }

// ---- Native file save/share (Capacitor Android shell only) ----
// The Android WebView doesn't support <a download> for blob/data URLs or the
// Web Share API, so file-producing features (backup export, snapshot PNG)
// branch to Capacitor's Filesystem+Share plugins when running as the native
// app. Everything falls through to the existing web code otherwise.
function isNativeApp(){ return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }
function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
async function nativeSaveAndShare(filename, blob, title){
  const { Filesystem, Share } = window.Capacitor.Plugins;
  const data = await blobToBase64(blob);
  const { uri } = await Filesystem.writeFile({ path: filename, data, directory: "CACHE" });
  await Share.share({ title: title||filename, url: uri });
}

// =====================================================================
// Repository — every business rule lives here (the "backend" layer).
// Screens never touch IndexedDB directly, only through these methods.
// =====================================================================
const Repo = {

  // ---- Partners ----
  async allPartners(){ return (await getAll("partners")).sort((a,b)=>a.name.localeCompare(b.name)); },
  async addPartner({name, share_percent}){
    const p = {id:uid(), name, share_percent:Number(share_percent)||0, running_balance:0};
    await put("partners", p); return p;
  },
  async updatePartner(id, patch){
    const p = await get("partners", id); if(!p) throw new Error("Partner not found");
    Object.assign(p, patch); await put("partners", p); return p;
  },
  async removePartner(id){
    const p = await get("partners", id); if(!p) return;
    if (Math.round((p.running_balance||0)*100) !== 0) throw new Error("Can't remove a partner with a nonzero balance. Settle them first.");
    const receivers = await getAll("receivers");
    if (receivers.some(r => r.partner_id === id)) throw new Error("Can't remove a partner with linked receivers. Reassign or remove those receivers first.");
    await del("partners", id);
  },
  async validateShares(){
    const partners = await this.allPartners();
    const sum = partners.reduce((s,p)=>s+(Number(p.share_percent)||0), 0);
    return { ok: Math.abs(sum-100) < 0.01, sum, partners };
  },

  // ---- Receivers ----
  async allReceivers(){ return (await getAll("receivers")).sort((a,b)=>a.name.localeCompare(b.name)); },
  async addReceiver({name, partner_id}){ const r={id:uid(), name, partner_id}; await put("receivers", r); return r; },
  async updateReceiver(id, patch){ const r=await get("receivers", id); if(!r) throw new Error("Receiver not found"); Object.assign(r, patch); await put("receivers", r); return r; },
  async removeReceiver(id){
    const splits = await getAll("transaction_splits");
    if (splits.some(s => s.receiver_id === id)) throw new Error("Can't remove a receiver with recorded transactions.");
    await del("receivers", id);
  },

  // ---- Properties ----
  async allProperties(){ return (await getAll("properties")).sort((a,b)=>a.name.localeCompare(b.name)); },
  async addProperty({name, type, owner_name, owner_rent_amount}){
    const p = {id:uid(), name, type:type||"", owner_name:owner_name||"", owner_rent_amount:Number(owner_rent_amount)||0};
    await put("properties", p); return p;
  },
  async updateProperty(id, patch){ const p=await get("properties", id); if(!p) throw new Error("Property not found"); Object.assign(p, patch); await put("properties", p); return p; },
  async deleteProperty(id){
    const tenants = await getAll("tenants");
    if (tenants.some(t => t.property_id === id)) throw new Error("Can't delete a property that still has tenants.");
    await del("properties", id);
  },
  async tenantsForProperty(propertyId){ return (await getAll("tenants")).filter(t=>t.property_id===propertyId).sort((a,b)=>a.name.localeCompare(b.name)); },
  async tenantCountForProperty(propertyId){ return (await this.tenantsForProperty(propertyId)).filter(t=>!t.archived).length; },

  // ---- Tenants & accrual ----
  async addTenant({property_id, name, monthly_rent, phone}){
    const rate = Number(monthly_rent)||0;
    const startMk = monthKey();
    const t = {
      id:uid(), property_id, name, monthly_rent:rate, current_balance:0,
      last_accrual_month: startMk, start_date: todayISO(), archived:false,
      rent_history: [{effective_month: startMk, rent: rate}],
      phone: (phone||"").trim()
    };
    await put("tenants", t);
    // A brand-new tenant owes rent for their move-in month right away — don't
    // make them wait for next calendar month's accrual pass to show as Due.
    await this.accrueMonthlyRent(t);
    return t;
  },
  async updateTenant(id, patch){ const t=await get("tenants", id); if(!t) throw new Error("Tenant not found"); Object.assign(t, patch); await put("tenants", t); return t; },
  async deleteTenant(id){
    const txns = await getAll("transactions");
    if (txns.some(x => x.tenant_id === id && !x.is_voided)) throw new Error("This tenant has payment history, so deleting them would break the ledger. Use \u201cMark as moved out\u201d instead \u2014 it hides them from the active list but keeps every past payment on record.");
    await del("tenants", id);
  },
  // Admin override for cleaning up test/typo data (e.g. while still setting the
  // app up): deletes a tenant AND every one of their transactions, splits, and
  // audit-log entries, regardless of history. Unlike deleteTenant, this leaves
  // no trace and is not meant for real day-to-day corrections — use "Mark as
  // moved out" or void/edit for those instead.
  async forceDeleteTenant(id){
    const txns = (await getAll("transactions")).filter(x=>x.tenant_id===id);
    for (const x of txns){
      for (const s of await this.splitsFor(x.id)) await del("transaction_splits", s.id);
      for (const a of await this.auditLogFor(x.id)) await del("audit_log", a.id);
      await del("transactions", x.id);
    }
    await del("tenants", id);
  },
  // Admin override for permanently removing a single transaction (and its
  // splits/audit entries) instead of just voiding it — again, for cleaning up
  // test/typo entries, not for correcting real records (edit or void those).
  async deleteTransactionPermanently(id){
    const txn = await get("transactions", id); if(!txn) return;
    if (!txn.is_voided){
      const tenant = await get("tenants", txn.tenant_id);
      if (tenant){
        if (txn.type === "ADJUSTMENT") tenant.current_balance = (tenant.current_balance||0) - (txn.adjustment_amount||0);
        else tenant.current_balance = (tenant.current_balance||0) + (txn.total_amount + txn.repair_amount);
        await put("tenants", tenant);
      }
    }
    for (const s of await this.splitsFor(id)) await del("transaction_splits", s.id);
    for (const a of await this.auditLogFor(id)) await del("audit_log", a.id);
    await del("transactions", id);
  },
  // Archive = "moved out". Keeps every past transaction and any balance owed intact;
  // just marks the tenant inactive so the property's tenant list can hide/mute them.
  async archiveTenant(id, archived=true){
    const t = await get("tenants", id); if(!t) throw new Error("Tenant not found");
    t.archived = !!archived;
    await put("tenants", t);
    return t;
  },
  // Fixes a mistake in the CURRENT rent rate — e.g. a typo'd 13,000 that should
  // have been 12,000 all along. Corrects the latest rent_history entry in place
  // (this was never a genuine change, so there's nothing to preserve about the
  // old value) and retroactively adjusts the tenant's balance for every month
  // already accrued under that wrong rate, logged as an auditable adjustment.
  async correctCurrentRent(tenantId, newRate){
    const tenant = await get("tenants", tenantId); if(!tenant) throw new Error("Tenant not found");
    newRate = Number(newRate)||0;
    const history = (tenant.rent_history && tenant.rent_history.length) ? [...tenant.rent_history] : [{effective_month: monthKey(tenant.start_date), rent: tenant.monthly_rent||0}];
    const last = {...history[history.length-1]};
    const oldRate = last.rent;
    if (Math.round((newRate-oldRate)*100) === 0) throw new Error("That's already the current rent");
    const accrualEnd = tenant.last_accrual_month || monthKey();
    const monthsAtOldRate = last.effective_month <= accrualEnd ? monthsBetween(last.effective_month, accrualEnd) + 1 : 0;
    last.rent = newRate;
    history[history.length-1] = last;
    tenant.rent_history = history;
    tenant.monthly_rent = rentRateForMonth(tenant, monthKey());
    await put("tenants", tenant);
    const delta = (newRate - oldRate) * monthsAtOldRate;
    if (Math.round(delta*100) !== 0){
      await this.recordBalanceAdjustment({
        tenant_id: tenantId, amount: delta,
        note: `Rent corrected: ${fmtMoney(oldRate)} → ${fmtMoney(newRate)}/mo (${monthsAtOldRate} month${monthsAtOldRate===1?"":"s"} already charged, retroactively fixed)`,
        date: todayISO()
      });
    }
    return tenant;
  },
  // Records a genuine rent change (e.g. a yearly increase) taking effect from a
  // chosen future month onward. Past accrual is untouched — it was correct at
  // the rate that applied then — this only adds a new rent_history entry.
  async scheduleRentChange(tenantId, newRate, effectiveMonth){
    const tenant = await get("tenants", tenantId); if(!tenant) throw new Error("Tenant not found");
    newRate = Number(newRate)||0;
    const history = (tenant.rent_history && tenant.rent_history.length) ? [...tenant.rent_history] : [{effective_month: monthKey(tenant.start_date), rent: tenant.monthly_rent||0}];
    const minMonth = addMonths(tenant.last_accrual_month || monthKey(), 1);
    if (effectiveMonth < minMonth) throw new Error(`${fmtMonth(minMonth)} is the earliest this can take effect — earlier months are already accrued. Use "Correct current rent" instead if this fixes a mistake.`);
    const filtered = history.filter(h => h.effective_month !== effectiveMonth);
    filtered.push({effective_month: effectiveMonth, rent: newRate});
    filtered.sort((a,b) => a.effective_month.localeCompare(b.effective_month));
    tenant.rent_history = filtered;
    tenant.monthly_rent = rentRateForMonth(tenant, monthKey());
    await put("tenants", tenant);
    return tenant;
  },
  // hasAnyTxnHint (optional): pass a precomputed Set of tenant_ids that have any
  // transaction, so runDueAccruals doesn't re-query transactions per tenant.
  async accrueMonthlyRent(tenant, hasAnyTxnHint){
    const nowMk = monthKey();
    let cursor = tenant.last_accrual_month || nowMk;
    let added = 0, monthsAccrued = 0;
    while (cursor < nowMk){
      cursor = addMonths(cursor, 1);
      added += rentRateForMonth(tenant, cursor);
      monthsAccrued++;
    }
    // Safety net: a tenant whose move-in month equals their last accrual month
    // and who has never had a single transaction can only be sitting at a zero
    // balance because their very first month was never actually added (the bug
    // this patches) — not because they've genuinely paid anything. Charge that
    // first month now instead of waiting for the calendar to roll over.
    if (monthsAccrued === 0 && (tenant.current_balance||0) === 0 && tenant.last_accrual_month === monthKey(tenant.start_date || nowMk)){
      const hasAnyTxn = hasAnyTxnHint !== undefined ? hasAnyTxnHint : (await getAll("transactions")).some(x=>x.tenant_id===tenant.id);
      if (!hasAnyTxn){ added += rentRateForMonth(tenant, nowMk); monthsAccrued = 1; }
    }
    const currentRate = rentRateForMonth(tenant, nowMk);
    const rateFieldStale = Math.round((currentRate - (tenant.monthly_rent||0))*100) !== 0;
    if (monthsAccrued > 0 || rateFieldStale){
      if (monthsAccrued > 0) tenant.current_balance = (tenant.current_balance||0) + added;
      tenant.monthly_rent = currentRate;
      tenant.last_accrual_month = nowMk;
      await put("tenants", tenant);
    }
    return tenant;
  },
  async runDueAccruals(){
    const [tenants, txns] = await Promise.all([getAll("tenants"), getAll("transactions")]);
    const tenantsWithTxns = new Set(txns.map(x=>x.tenant_id));
    for (const t of tenants) await this.accrueMonthlyRent(t, tenantsWithTxns.has(t.id));
  },
  // Reconstructs Due / Paid rows for a tenant's ledger without storing a row per month.
  async tenantLedgerRows(tenantId){
    const tenant = await get("tenants", tenantId); if(!tenant) return {tenant:null, rows:[], balance:0};
    const [txns, allSplits, receivers] = await Promise.all([
      getAll("transactions").then(all=>all.filter(x=>x.tenant_id===tenantId).sort((a,b)=> a.date.localeCompare(b.date))),
      getAll("transaction_splits"),
      this.allReceivers()
    ]);
    const receiverById = Object.fromEntries(receivers.map(r=>[r.id,r]));
    const receiverNamesFor = (txnId) => allSplits.filter(s=>s.transaction_id===txnId).map(s=>receiverById[s.receiver_id]?.name).filter(Boolean);
    const events = [];
    let cursor = monthKey(tenant.start_date);
    const end = tenant.last_accrual_month || monthKey();
    while (cursor <= end){
      events.push({date: cursor+"-01", type:"due", label:"Rent due — "+fmtMonth(cursor), amount: rentRateForMonth(tenant, cursor)});
      cursor = addMonths(cursor, 1);
    }
    for (const x of txns){
      if (x.is_voided) continue;
      if (x.type === "RENT_PAYMENT"){
        const via = receiverNamesFor(x.id);
        const viaLabel = via.length ? ` (via ${via.join(", ")})` : "";
        events.push({date:x.date, type:"paid", label: (x.total_amount<0?"Refund / advance return":"Payment received") + viaLabel + (x.note?` — ${x.note}`:""), amount: x.total_amount});
        if (x.repair_amount) events.push({date:x.date, type:"paid", label:"Repair deduction", amount: x.repair_amount});
      } else if (x.type === "ADJUSTMENT"){
        const amt = x.adjustment_amount||0;
        const defaultLabel = amt>=0 ? "Balance adjustment (added)" : "Balance adjustment (reduced)";
        events.push({date:x.date, type: amt>=0?"due":"paid", label: x.note || defaultLabel, amount: Math.abs(amt)});
      }
    }
    events.sort((a,b)=> a.date.localeCompare(b.date));
    let running = 0; const rows = [];
    for (const e of events){
      running += (e.type==="due" ? e.amount : -e.amount);
      rows.push({...e, running});
    }
    return {tenant, rows, balance: tenant.current_balance||0};
  },

  // ---- Transactions ----
  async recordRentPayment({tenant_id, total_amount, repair_amount, note, receipt, date, splits}){
    total_amount = Number(total_amount)||0;
    repair_amount = Number(repair_amount)||0;
    splits = (splits||[]).map(s=>({...s, amount:Number(s.amount)||0})).filter(s=>s.receiver_id && s.amount);
    const splitSum = splits.reduce((s,x)=>s+x.amount,0);
    if (splits.length && Math.round((splitSum-total_amount)*100)!==0){
      throw new Error(`Splits (${fmtMoney(splitSum)}) must add up to the amount received (${fmtMoney(total_amount)}).`);
    }
    const tenant = await get("tenants", tenant_id); if(!tenant) throw new Error("Tenant not found");
    const txn = {
      id:uid(), type:"RENT_PAYMENT", tenant_id, property_id: tenant.property_id,
      total_amount, repair_amount, is_voided:false, date: date||todayISO(),
      note: note||"", receipt: receipt||null
    };
    await put("transactions", txn);
    for (const s of splits){
      await put("transaction_splits", {id:uid(), transaction_id:txn.id, receiver_id:s.receiver_id, amount:s.amount, settled_at:null});
    }
    tenant.current_balance = (tenant.current_balance||0) - (total_amount + repair_amount);
    await put("tenants", tenant);
    return txn;
  },
  // A manual, logged correction to a tenant's balance — e.g. folding in a pending
  // due amount carried over from a paper ledger before this app tracked them.
  // Positive amount = adds to what they owe; negative = reduces it (a credit).
  // Shows up in the tenant's ledger and can be voided like any other transaction,
  // so it never causes the ledger and the tenant's balance to drift apart.
  async recordBalanceAdjustment({tenant_id, amount, note, date}){
    amount = Number(amount)||0;
    if (!amount) throw new Error("Enter a non-zero amount");
    const tenant = await get("tenants", tenant_id); if(!tenant) throw new Error("Tenant not found");
    const txn = {
      id:uid(), type:"ADJUSTMENT", tenant_id, property_id: tenant.property_id,
      total_amount:0, repair_amount:0, adjustment_amount:amount, is_voided:false,
      date: date||todayISO(), note: note||""
    };
    await put("transactions", txn);
    tenant.current_balance = (tenant.current_balance||0) + amount;
    await put("tenants", tenant);
    return txn;
  },
  // Correct a mistake in an existing rent payment in place, rather than making
  // the person void it and re-enter it from scratch. Reverses the transaction's
  // old effect on the tenant's balance and applies the corrected one, replaces
  // its splits, and writes an EDIT audit-log entry alongside the transaction's
  // own record so the change is traceable like everything else.
  async editRentPayment(id, {total_amount, repair_amount, note, receipt, date, splits}){
    const txn = await get("transactions", id); if(!txn) throw new Error("Transaction not found");
    if (txn.type !== "RENT_PAYMENT") throw new Error("Only rent payments can be edited here");
    if (txn.is_voided) throw new Error("This transaction has been voided and can't be edited");
    const existingSplits = await this.splitsFor(id);
    if (existingSplits.some(s=>s.settled_at)) throw new Error("This payment's cash has already been settled with a partner, so it can't be edited. Void it instead if it was a mistake.");

    total_amount = Number(total_amount)||0;
    repair_amount = Number(repair_amount)||0;
    splits = (splits||[]).map(s=>({...s, amount:Number(s.amount)||0})).filter(s=>s.receiver_id && s.amount);
    const splitSum = splits.reduce((s,x)=>s+x.amount,0);
    if (splits.length && Math.round((splitSum-total_amount)*100)!==0){
      throw new Error(`Splits (${fmtMoney(splitSum)}) must add up to the amount received (${fmtMoney(total_amount)}).`);
    }
    const tenant = await get("tenants", txn.tenant_id); if(!tenant) throw new Error("Tenant not found");
    const oldData = JSON.stringify(txn);

    tenant.current_balance = (tenant.current_balance||0) + (txn.total_amount + txn.repair_amount) - (total_amount + repair_amount);
    await put("tenants", tenant);

    for (const s of existingSplits) await del("transaction_splits", s.id);
    for (const s of splits) await put("transaction_splits", {id:uid(), transaction_id:id, receiver_id:s.receiver_id, amount:s.amount, settled_at:null});

    txn.total_amount = total_amount;
    txn.repair_amount = repair_amount;
    txn.note = note||"";
    txn.receipt = (receipt!==undefined) ? receipt : (txn.receipt||null);
    txn.date = date || txn.date;
    await put("transactions", txn);
    await put("audit_log", {id:uid(), transaction_id:id, action:"EDIT", old_data:oldData, new_data:JSON.stringify(txn), timestamp:new Date().toISOString()});
    return txn;
  },
  // Same idea as editRentPayment, for a balance adjustment entry.
  async editBalanceAdjustment(id, {amount, note, date}){
    const txn = await get("transactions", id); if(!txn) throw new Error("Transaction not found");
    if (txn.type !== "ADJUSTMENT") throw new Error("Only balance adjustments can be edited here");
    if (txn.is_voided) throw new Error("This has been voided and can't be edited");
    amount = Number(amount)||0;
    if (!amount) throw new Error("Enter a non-zero amount");
    const tenant = await get("tenants", txn.tenant_id); if(!tenant) throw new Error("Tenant not found");
    const oldData = JSON.stringify(txn);
    tenant.current_balance = (tenant.current_balance||0) - (txn.adjustment_amount||0) + amount;
    await put("tenants", tenant);
    txn.adjustment_amount = amount;
    txn.note = note||"";
    txn.date = date || txn.date;
    await put("transactions", txn);
    await put("audit_log", {id:uid(), transaction_id:id, action:"EDIT", old_data:oldData, new_data:JSON.stringify(txn), timestamp:new Date().toISOString()});
    return txn;
  },
  async voidTransaction(id){
    const txn = await get("transactions", id); if(!txn) throw new Error("Transaction not found");
    if (txn.is_voided) return txn;
    const oldData = JSON.stringify(txn);
    const tenant = await get("tenants", txn.tenant_id);
    if (tenant){
      if (txn.type === "ADJUSTMENT") tenant.current_balance = (tenant.current_balance||0) - (txn.adjustment_amount||0);
      else tenant.current_balance = (tenant.current_balance||0) + (txn.total_amount + txn.repair_amount);
      await put("tenants", tenant);
    }
    txn.is_voided = true;
    await put("transactions", txn);
    await put("audit_log", {id:uid(), transaction_id:id, action:"VOID", old_data:oldData, new_data:JSON.stringify(txn), timestamp:new Date().toISOString()});
    return txn;
  },
  async auditLogFor(transactionId){ return (await getAll("audit_log")).filter(a=>a.transaction_id===transactionId).sort((a,b)=>b.timestamp.localeCompare(a.timestamp)); },
  async splitsFor(transactionId){ return (await getAll("transaction_splits")).filter(s=>s.transaction_id===transactionId); },

  // ---- Settlement ----
  // Settlement reconciles the fact that different partners already hold different
  // amounts of physical cash (via whichever receivers report into them), against
  // what each partner is entitled to (their share % of the period's pool, plus
  // whatever was left owing from before). The imbalance becomes a small set of
  // suggested partner-to-partner transfers rather than a single shared payout.
  async computeSettlement(period){
    const [receivers, splits, txns, properties, partners] = await Promise.all([
      this.allReceivers(), getAll("transaction_splits"), getAll("transactions"), this.allProperties(), this.allPartners()
    ]);
    const txnById = Object.fromEntries(txns.map(t=>[t.id,t]));
    const receiverById = Object.fromEntries(receivers.map(r=>[r.id,r]));
    const relevantSplits = splits.filter(s=>{
      if (s.settled_at) return false;
      const t = txnById[s.transaction_id];
      if (!t || t.is_voided) return false;
      return monthKey(t.date) === period;
    });
    const grossCollected = relevantSplits.reduce((s,x)=>s+x.amount, 0);
    const ownerRentTotal = properties.reduce((s,p)=>s+(Number(p.owner_rent_amount)||0), 0);
    const finalTotal = grossCollected - ownerRentTotal;

    const byPartner = {};
    for (const p of partners) byPartner[p.id] = {collected:0, splitIds:[]};
    let unassigned = 0;
    for (const s of relevantSplits){
      const r = receiverById[s.receiver_id];
      if (r && r.partner_id && byPartner[r.partner_id]){ byPartner[r.partner_id].collected += s.amount; byPartner[r.partner_id].splitIds.push(s.id); }
      else unassigned += s.amount;
    }

    const rows = partners.map(p=>{
      const share = finalTotal * ((Number(p.share_percent)||0)/100);
      const opening = Number(p.running_balance)||0;
      const collected = byPartner[p.id].collected;
      const entitled = share + opening;
      // net > 0: this partner holds less cash than they're entitled to — owed to them.
      // net < 0: this partner is holding more than their share — they owe the excess out.
      const net = entitled - collected;
      return { partner_id:p.id, name:p.name, share_percent:p.share_percent, collected, share, opening_balance:opening, entitled, net, split_ids: byPartner[p.id].splitIds };
    });

    // Greedy debt-netting: match the biggest "owes" against the biggest "owed"
    // until everyone's net is settled, minimizing the number of transfers needed.
    const debtors = rows.filter(r=>r.net < -0.004).map(r=>({partner_id:r.partner_id, name:r.name, amount:-r.net})).sort((a,b)=>b.amount-a.amount);
    const creditors = rows.filter(r=>r.net > 0.004).map(r=>({partner_id:r.partner_id, name:r.name, amount:r.net})).sort((a,b)=>b.amount-a.amount);
    const transfers = [];
    let i=0, j=0;
    while (i<debtors.length && j<creditors.length){
      const amt = Math.min(debtors[i].amount, creditors[j].amount);
      if (amt > 0.004) transfers.push({from_partner_id:debtors[i].partner_id, from_name:debtors[i].name, to_partner_id:creditors[j].partner_id, to_name:creditors[j].name, amount:amt});
      debtors[i].amount -= amt; creditors[j].amount -= amt;
      if (debtors[i].amount <= 0.004) i++;
      if (creditors[j].amount <= 0.004) j++;
    }

    return { period, grossCollected, ownerRentTotal, finalTotal, unassigned, rows, transfers };
  },
  // transferAmounts: {transferIndex: amountActuallyMoved} — lets the person record a
  // partial transfer; whatever's left of each partner's net carries forward as their
  // new running_balance, same "shortfall carries to next period" rule as before.
  async recordSettlement(period, computed, transferAmounts){
    const movement = {}; // partner_id -> net cash movement this round (received minus paid)
    const transferDate = todayISO();
    for (let idx = 0; idx < computed.transfers.length; idx++){
      const t = computed.transfers[idx];
      const paid = Number(transferAmounts[idx]) || 0;
      movement[t.from_partner_id] = (movement[t.from_partner_id]||0) - paid;
      movement[t.to_partner_id] = (movement[t.to_partner_id]||0) + paid;
      const remaining = t.amount - paid;
      const status = remaining <= 0.004 ? "paid" : (paid > 0.004 ? "partial" : "unpaid");
      // An explicit, permanent record of who was supposed to pay whom, how much
      // actually moved, and what's left — not just an update to a running number.
      await put("partner_transfers", {
        id: uid(), period, date: transferDate,
        from_partner_id: t.from_partner_id, from_name: t.from_name,
        to_partner_id: t.to_partner_id, to_name: t.to_name,
        suggested_amount: t.amount, paid_amount: paid, remaining_amount: Math.max(0, remaining),
        status
      });
    }
    for (const row of computed.rows){
      const closing = row.net - (movement[row.partner_id] || 0);
      await put("partner_settlements", {
        id:uid(), partner_id: row.partner_id, period, share_amount: row.share,
        opening_balance: row.opening_balance, collected: row.collected, net: row.net,
        closing_balance: closing, date: transferDate
      });
      const partner = await get("partners", row.partner_id);
      if (partner){ partner.running_balance = closing; await put("partners", partner); }
      for (const sid of row.split_ids){
        const split = await get("transaction_splits", sid);
        if (split){ split.settled_at = transferDate; await put("transaction_splits", split); }
      }
    }
  },
  async settlementHistory(){ return (await getAll("partner_settlements")).sort((a,b)=>b.date.localeCompare(a.date)); },
  async transferHistory(){ return (await getAll("partner_transfers")).sort((a,b)=>b.date.localeCompare(a.date)); },


  // ---- Reporting ----
  async defaulterTenants(){ return (await getAll("tenants")).filter(t=>(t.current_balance||0) > 0); },
  async defaulterTenantsWithProperty(propertyId){
    const props = Object.fromEntries((await this.allProperties()).map(p=>[p.id,p]));
    let list = await this.defaulterTenants();
    if (propertyId) list = list.filter(t=>t.property_id===propertyId);
    return list.map(t=>({...t, property: props[t.property_id]})).sort((a,b)=>(b.current_balance||0)-(a.current_balance||0));
  },
  async cashInHandByReceiver(){
    const [receivers, splits, txns, partners, properties] = await Promise.all([
      this.allReceivers(), getAll("transaction_splits"), getAll("transactions"), this.allPartners(), this.allProperties()
    ]);
    const txnById = Object.fromEntries(txns.map(t=>[t.id,t]));
    const partnerById = Object.fromEntries(partners.map(p=>[p.id,p]));
    const propertyById = Object.fromEntries(properties.map(p=>[p.id,p]));
    return receivers.map(r=>{
      const relevant = splits.filter(s=>s.receiver_id===r.id && !s.settled_at && txnById[s.transaction_id] && !txnById[s.transaction_id].is_voided);
      const amount = relevant.reduce((s,x)=>s+x.amount,0);
      const byPropertyMap = {};
      for (const s of relevant){
        const txn = txnById[s.transaction_id];
        const prop = propertyById[txn.property_id];
        const key = txn.property_id || "unknown";
        if (!byPropertyMap[key]) byPropertyMap[key] = {property: prop, amount: 0};
        byPropertyMap[key].amount += s.amount;
      }
      const byProperty = Object.values(byPropertyMap).sort((a,b)=>b.amount-a.amount);
      return { receiver:r, partner: partnerById[r.partner_id]||null, amount, byProperty };
    }).sort((a,b)=>b.amount-a.amount);
  },
  // Rolls receiver-level cash up to the partner pool it reports into — this is
  // "how much is each partner actually holding right now", across everyone who
  // collects on their behalf.
  async cashInHandByPartner(){
    const [byReceiver, partners] = await Promise.all([this.cashInHandByReceiver(), this.allPartners()]);
    const byPartner = {}; for (const p of partners) byPartner[p.id] = {partner:p, amount:0, receivers:[]};
    let unassigned = 0;
    for (const r of byReceiver){
      if (r.amount <= 0.004) continue;
      if (r.partner && byPartner[r.partner.id]){ byPartner[r.partner.id].amount += r.amount; byPartner[r.partner.id].receivers.push(r); }
      else unassigned += r.amount;
    }
    return { rows: Object.values(byPartner).sort((a,b)=>b.amount-a.amount), unassigned };
  },
  async totalArrears(){ return (await this.defaulterTenants()).reduce((s,t)=>s+(t.current_balance||0), 0); },
  async totalCollectedThisMonth(){
    return this.totalCollectedForMonth(monthKey());
  },
  // Parameterized version of the above, for a specific month (used by the snapshot).
  async totalCollectedForMonth(mk){
    const txns = await getAll("transactions");
    return txns.filter(x=>!x.is_voided && x.type==="RENT_PAYMENT" && monthKey(x.date)===mk).reduce((s,x)=>s+x.total_amount, 0);
  },
  // A tenant's true FIFO balance as of the end of a given month — recomputed from
  // their full transaction history filtered to that cutoff, not today's stored
  // current_balance, so a snapshot of a past month reports what was actually
  // owed at that point in time rather than today's figure.
  async tenantBalanceAsOf(tenantId, mk){
    const tenant = await get("tenants", tenantId); if(!tenant) return 0;
    const startMk = monthKey(tenant.start_date);
    if (mk < startMk) return 0;
    const accrualEnd = (tenant.last_accrual_month && tenant.last_accrual_month < mk) ? tenant.last_accrual_month : mk;
    let cumDue = 0;
    let cursor = startMk;
    while (cursor <= accrualEnd){ cumDue += rentRateForMonth(tenant, cursor); cursor = addMonths(cursor, 1); }
    const cutoffDate = mk + "-31";
    const txns = (await getAll("transactions")).filter(x=>x.tenant_id===tenantId && !x.is_voided && x.date <= cutoffDate);
    let cumPaid = 0;
    for (const x of txns){
      if (x.type === "RENT_PAYMENT") cumPaid += (x.total_amount + x.repair_amount);
      else if (x.type === "ADJUSTMENT") cumDue += (x.adjustment_amount||0);
    }
    return cumDue - cumPaid;
  },
  // Total arrears as of the end of a given month (for a historical snapshot),
  // rather than today's totalArrears().
  async arrearsAsOf(mk){
    const tenants = await getAll("tenants");
    let total = 0;
    for (const t of tenants){
      const bal = await this.tenantBalanceAsOf(t.id, mk);
      if (bal > 0) total += bal;
    }
    return total;
  },
  // A single tenant's collection status for one specific month: did payments
  // *dated in that month* cover at least a full month's rent? This answers
  // "did we collect from them this month" — simpler and more scannable than a
  // strict oldest-debt-first allocation, which is what Defaulters/the ledger
  // already show. An advance payment counts toward the month it's recorded in.
  monthlyTenantStatusFromTxns(tenant, mk, txnsForTenant){
    const startMk = monthKey(tenant.start_date);
    if (mk < startMk) return null; // wasn't a tenant yet
    const due = rentRateForMonth(tenant, mk);
    const paid = txnsForTenant
      .filter(x => !x.is_voided && x.type === "RENT_PAYMENT" && monthKey(x.date) === mk)
      .reduce((s,x) => s + x.total_amount + x.repair_amount, 0);
    let status;
    if (due <= 0) status = "paid";
    else if (paid >= due - 0.005) status = "paid";
    else if (paid > 0.005) status = "partial";
    else status = "due";
    return { status, paid, due };
  },
  // Monthly status for every tenant across the whole portfolio (or one property),
  // used by both the per-property monthly view and the dashboard snapshot.
  async monthlyStatusForAllTenants(mk, propertyId){
    const [tenants, properties, txns] = await Promise.all([getAll("tenants"), this.allProperties(), getAll("transactions")]);
    const pById = Object.fromEntries(properties.map(p=>[p.id,p]));
    const txnsByTenant = {};
    for (const x of txns){ (txnsByTenant[x.tenant_id] ||= []).push(x); }
    const list = propertyId ? tenants.filter(t=>t.property_id===propertyId) : tenants;
    return list
      .map(t => {
        const r = this.monthlyTenantStatusFromTxns(t, mk, txnsByTenant[t.id] || []);
        return r ? { tenant:t, property: pById[t.property_id], ...r } : null;
      })
      .filter(Boolean)
      .sort((a,b)=>a.tenant.name.localeCompare(b.tenant.name));
  },
  // Per-property rollup for a given month: counts + cash collected, for the
  // dashboard snapshot's "by property" section.
  async monthlyPropertyBreakdown(mk){
    const [properties, statuses] = await Promise.all([this.allProperties(), this.monthlyStatusForAllTenants(mk)]);
    return properties.map(p => {
      const rows = statuses.filter(s=>s.property && s.property.id===p.id);
      return {
        property: p,
        total: rows.length,
        paid: rows.filter(r=>r.status==="paid").length,
        partial: rows.filter(r=>r.status==="partial").length,
        due: rows.filter(r=>r.status==="due").length,
        collected: rows.reduce((s,r)=>s+r.paid,0)
      };
    }).filter(r=>r.total>0);
  },
  async recentTransactions(limit=8){
    const [txns, tenants, properties, splits, receivers] = await Promise.all([
      getAll("transactions"), getAll("tenants"), this.allProperties(), getAll("transaction_splits"), this.allReceivers()
    ]);
    const tById = Object.fromEntries(tenants.map(t=>[t.id,t]));
    const pById = Object.fromEntries(properties.map(p=>[p.id,p]));
    const receiverById = Object.fromEntries(receivers.map(r=>[r.id,r]));
    return txns.sort((a,b)=>b.date.localeCompare(a.date) || (b.id>a.id?1:-1)).slice(0,limit)
      .map(x=>({
        ...x, tenant:tById[x.tenant_id], property:pById[x.property_id],
        receivedByNames: splits.filter(s=>s.transaction_id===x.id).map(s=>receiverById[s.receiver_id]?.name).filter(Boolean)
      }));
  },
  async allTenantsWithProperty(){
    const [tenants, properties] = await Promise.all([getAll("tenants"), this.allProperties()]);
    const pById = Object.fromEntries(properties.map(p=>[p.id,p]));
    return tenants.map(t=>({...t, property:pById[t.property_id]})).sort((a,b)=>a.name.localeCompare(b.name));
  },
  // Portfolio-wide counts for the dashboard stat grid.
  async portfolioTotals(){
    const [properties, tenants] = await Promise.all([this.allProperties(), getAll("tenants")]);
    return { properties: properties.length, tenants: tenants.length };
  },
  // Monthly collections trend for the dashboard bar chart / report. endMonth
  // defaults to the real current month (dashboard use); the report passes the
  // period being reported on, so a past month's trend doesn't shift to "today".
  async monthlyCollections(n=6, endMonth){
    const end = endMonth || monthKey();
    const months = []; for (let i=n-1;i>=0;i--) months.push(addMonths(end,-i));
    const txns = await getAll("transactions");
    return months.map(mk => ({
      label: fmtMonthShort(mk),
      value: txns.filter(x=>!x.is_voided && x.type==="RENT_PAYMENT" && monthKey(x.date)===mk).reduce((s,x)=>s+x.total_amount,0)
    }));
  },
  // Arrears grouped by property for the dashboard donut chart.
  async arrearsByProperty(){
    const [tenants, properties] = await Promise.all([getAll("tenants"), this.allProperties()]);
    const byProp = {}; for (const p of properties) byProp[p.id] = {label:p.name, value:0};
    for (const t of tenants){ if ((t.current_balance||0)>0 && byProp[t.property_id]) byProp[t.property_id].value += t.current_balance; }
    return Object.values(byProp).filter(x=>x.value>0.009).sort((a,b)=>b.value-a.value);
  },
  // Defaulters as of a specific month's end (historical, for a past month's
  // report) rather than today's rolling balance — same idea as arrearsAsOf,
  // but returning the per-tenant rows instead of just the total.
  async defaultersAsOf(mk){
    const [tenants, properties] = await Promise.all([getAll("tenants"), this.allProperties()]);
    const pById = Object.fromEntries(properties.map(p=>[p.id,p]));
    const rows = [];
    for (const t of tenants){
      const bal = await this.tenantBalanceAsOf(t.id, mk);
      if (bal > 0.004) rows.push({...t, current_balance: bal, property: pById[t.property_id]});
    }
    return rows.sort((a,b)=>b.current_balance-a.current_balance);
  },
  // Partner settlement figures for a report. If a settlement was already
  // recorded for this exact period, use those stored historical numbers —
  // computeSettlement() only looks at *unsettled* cash, so re-running it for
  // an already-settled month would wrongly show everything as zero. Only
  // fall back to a live computeSettlement() when nothing's been recorded yet
  // (e.g. reporting on the current, still-open month).
  async reportPartnerSettlementSummary(mk){
    const [historyAll, partners] = await Promise.all([this.settlementHistory(), this.allPartners()]);
    const partnerById = Object.fromEntries(partners.map(p=>[p.id,p]));
    const recorded = historyAll.filter(r => r.period === mk);
    if (recorded.length){
      return { recorded: true, rows: recorded.map(r => ({
        name: partnerById[r.partner_id] ? partnerById[r.partner_id].name : "—",
        share_percent: partnerById[r.partner_id] ? partnerById[r.partner_id].share_percent : 0,
        collected: r.collected, entitled: r.share_amount + r.opening_balance, net: r.net
      })) };
    }
    const computed = await this.computeSettlement(mk);
    return { recorded: false, rows: computed.rows.map(r => ({ name:r.name, share_percent:r.share_percent, collected:r.collected, entitled:r.entitled, net:r.net })) };
  },

  // ---- Data safety ----
  async exportDatabaseCopy(){
    const dump = {};
    for (const s of STORES) dump[s] = await getAll(s);
    dump._exported_at = new Date().toISOString();
    dump._version = DB_VERSION;
    const blob = new Blob([JSON.stringify(dump, null, 2)], {type:"application/json"});
    const filename = `mytenants-backup-${todayISO()}.json`;
    if (isNativeApp()){
      await nativeSaveAndShare(filename, blob, "myTenants backup");
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  },
  async importDatabaseCopy(json){
    const data = JSON.parse(json);
    for (const s of STORES){
      if (!Array.isArray(data[s])) continue;
      await tx(s, "readwrite", store => { store.clear(); data[s].forEach(row => store.put(row)); });
    }
  }
};

const State = { tab:"dashboard", propertyId:null, tenantId:null, modal:null };

function render(){ Screens[State.tab] ? Screens[State.tab]() : renderDashboard(); }

function Shell(title, sub, innerHtml, opts={}){
  const app = document.getElementById("app");
  const titleBlock = opts.logoImg
    ? `<img src="${opts.logoImg}" alt="${esc(title)}" style="height:60px;width:auto;display:block;border-radius:13px;">${sub?`<div class="sub" style="margin-top:6px;">${esc(sub)}</div>`:""}`
    : `<h1>${esc(title)}</h1>${sub?`<div class="sub">${esc(sub)}</div>`:""}`;
  app.innerHTML = `
    <div class="topbar">
      <div>${titleBlock}</div>
      ${opts.headerRight||""}
    </div>
    <div class="content">${innerHtml}</div>
    ${opts.fab||""}
    ${Tabs()}
  `;
}
function Tabs(){
  const items = [
    {id:"dashboard", ic:"dashboard", label:"Dashboard"},
    {id:"properties", ic:"apartment", label:"Properties"},
    {id:"defaulters", ic:"warning", label:"Defaulters"},
    {id:"cash", ic:"payments", label:"Cash"},
    {id:"partners", ic:"groups", label:"Partners"},
  ];
  return `<div class="tabs">${items.map(i=>`
    <button class="tab ${State.tab===i.id?"active":""}" onclick="goTab('${i.id}')">
      <span class="ic-wrap">${ic(i.ic)}</span><span>${i.label}</span>
    </button>`).join("")}</div>`;
}
function fabWrap(label, iconName, onclick){
  return `<div class="fab-wrap"><button class="fab-btn" onclick="${onclick}">${ic(iconName)}<span>${esc(label)}</span></button></div>`;
}
function goTab(id){ State.tab=id; State.propertyId=null; State.tenantId=null; render(); }

function statusChip(balance){
  if (balance > 0.001) return `<span class="chip due">${ic("schedule")}Due ${fmtMoney(balance)}</span>`;
  if (balance < -0.001) return `<span class="chip partial">${ic("arrow_upward")}Advance ${fmtMoney(-balance)}</span>`;
  return `<span class="chip paid">${ic("check_circle")}Paid</span>`;
}

// ---------- Dashboard ----------
const Screens = {};
Screens.dashboard = async function(){

async function requestPaymentViaWhatsApp(tenantId){
  const t = await get("tenants", tenantId);
  if (!t) return;
  const property = await get("properties", t.property_id);
  const due = t.current_balance||0;
  const message = `Hi, this is a reminder that the rent payment of ${fmtMoney(due)} for ${t.name}${property?` (${property.name})`:""} is currently pending. Kindly make the payment at your earliest convenience. Thank you!`;
  const phoneDigits = (t.phone||"").replace(/[^0-9]/g,"");
  const url = phoneDigits
    ? `https://wa.me/${phoneDigits}?text=${encodeURIComponent(message)}`
    : `https://wa.me/?text=${encodeURIComponent(message)}`;
  if (!phoneDigits) toast("No phone number saved — pick a chat in WhatsApp to send to");
  window.open(url, "_blank");
}

        <div class="row"><span style="font-weight:700;">${Math.abs(r.net)<0.005 ? "Already even" : r.net>0 ? "Owed to them" : "Holding extra — owes this out"}</span><span class="num" style="font-weight:700;color:${r.net>=0?'var(--paid)':'var(--due)'};">${fmtMoney(Math.abs(r.net))}</span></div>
      </div>`).join("") : `<div class="empty">Add partners first (see the Partners tab).</div>`}

    ${computed.transfers.length ? `

          </div>
        </div>`).join("")}
    ` : (computed.rows.length ? `<div class="empty">${ic("celebration")}Everyone already holds their fair share — nothing to transfer.</div>` : "")}

    ${computed.rows.length ? `<button class="btn" onclick="submitSettlement()">${ic("check")}Record settlement</button>` : ""}

  Shell("Settlement", fmtMonth(period), html);

function toggleTransferPaid(idx){
  const checkbox = document.getElementById("transfer-paid-"+idx);
  const wrap = document.getElementById("transfer-amount-wrap-"+idx);
  const input = document.getElementById("transfer-"+idx);
  if (checkbox.checked){
    input.disabled = false;
    input.value = input.dataset.suggested;
  } else {
    input.disabled = true;
    input.value = "0";
  }
  wrap.style.opacity = checkbox.checked ? "1" : ".5";
  refreshTransferNote(idx);
}
function refreshTransferNote(idx){
  const note = document.getElementById("transfer-note-"+idx);
  const input = document.getElementById("transfer-"+idx);
  if (!note || !input) return;
  const suggested = Number(input.dataset.suggested)||0;
  const actual = Number(input.value)||0;
  const remaining = suggested - actual;
  note.textContent = remaining > 0.004 ? `${fmtMoney(remaining)} still owed — carries forward to next month` : "";
}
async function submitSettlement(){
  const computed = State._lastSettlement;
  const transferAmounts = {};
  computed.transfers.forEach((t, idx) => { transferAmounts[idx] = document.getElementById("transfer-"+idx).value; });
  if (!confirm(`Record settlement for ${fmtMonth(computed.period)}? This marks the underlying cash as settled and updates each partner's carried balance.`)) return;
  await Repo.recordSettlement(computed.period, computed, transferAmounts);
  const unpaidCount = computed.transfers.filter((t, idx) => (Number(transferAmounts[idx])||0) < t.amount - 0.004).length;
  toast(unpaidCount ? `Settlement recorded — ${unpaidCount} transfer${unpaidCount===1?"":"s"} still owed` : "Settlement recorded — all transfers paid");
  goTab("cash");
}

async function importBackup(ev){
  const file = ev.target.files[0]; if(!file) return;
  const text = await file.text();
  let data;
  try{ data = JSON.parse(text); }
  catch(e){ toast("That doesn't look like a valid backup file"); ev.target.value=""; return; }
  const exportedAt = data._exported_at ? fmtDate(data._exported_at) : "an unknown date";
  const summary = [
    `${(data.properties||[]).length} properties`,
    `${(data.tenants||[]).length} tenants`,
    `${(data.transactions||[]).length} transactions`,
    `${(data.partners||[]).length} partners`
  ].join(", ");
  const proceed = confirm(`This backup was exported on ${exportedAt} and contains ${summary}.\n\nImporting will REPLACE everything currently in this browser with the backup's data. This can't be undone. Continue?`);
  if (!proceed){ ev.target.value=""; return; }
  try{ await Repo.importDatabaseCopy(text); toast("Backup restored"); goTab("dashboard"); }
  catch(e){ toast("Could not read backup file"); }
  ev.target.value="";
}

async function refreshRentCorrectionPreview(tenantId){
  const el = document.getElementById("rc-correct-preview"); if(!el) return;
  const t = await get("tenants", tenantId);
  const newRate = Number(document.getElementById("rc-correct-amount").value)||0;
  const currentRate = rentRateForMonth(t, monthKey());
  const history = (t.rent_history && t.rent_history.length) ? t.rent_history : [{effective_month: monthKey(t.start_date), rent: t.monthly_rent||0}];
  const last = history[history.length-1];
  const accrualEnd = t.last_accrual_month || monthKey();
  const months = last.effective_month <= accrualEnd ? monthsBetween(last.effective_month, accrualEnd) + 1 : 0;
  const delta = (newRate - currentRate) * months;
  if (Math.round(delta*100) === 0){ el.textContent = ""; return; }
  el.textContent = `${delta>0?"Adds":"Removes"} ${fmtMoney(Math.abs(delta))} ${delta>0?"to":"from"} their balance — ${months} month${months===1?"":"s"} already charged at ${fmtMoney(currentRate)}/mo.`;
}

async function buildSnapshotData(mk){
  const [collected, arrears, cashRows, statuses, byProperty] = await Promise.all([
    Repo.totalCollectedForMonth(mk), Repo.arrearsAsOf(mk), Repo.cashInHandByReceiver(),
    Repo.monthlyStatusForAllTenants(mk), Repo.monthlyPropertyBreakdown(mk)
  ]);
  const cashTotal = cashRows.reduce((s,r)=>s+r.amount,0);
  const paidCount = statuses.filter(s=>s.status==="paid").length;
  return { mk, collected, arrears, cashTotal, totalTenants: statuses.length, paidCount, byProperty };
}
function cssVar(name, fallback){ const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return v || fallback; }
async function renderSnapshotPreview(){
  const mk = document.getElementById("snap-month")?.value || State.snapshotMonth || monthKey();
  State.snapshotMonth = mk;
  const data = await buildSnapshotData(mk);
  const canvas = document.getElementById("snap-canvas");
  if (!canvas) return;
  await drawSnapshotCanvas(canvas, data);
}
async function drawSnapshotCanvas(canvas, data){
  try{ await document.fonts.ready; }catch(e){}
  const W = 1080;
  const margin = 56;
  const gap = 36;
  const colW = (W - margin*2 - 20) / 2;
  const primary = cssVar('--md-primary', '#2F6B5E');
  const onPrimary = '#ffffff';
  const ink = cssVar('--md-on-surface', '#191C1B');
  const inkSoft = cssVar('--md-on-surface-variant', '#48504C');
  const surfaceVariant = cssVar('--md-surface-variant', '#DDE5E0');
  const line = cssVar('--md-outline-variant', '#E2E6E2');

  const headerH = 200, statsH = 300, propRowH = 84, propHeaderH = 60, footerH = 90;
  const propsH = data.byProperty.length ? propHeaderH + data.byProperty.length*propRowH : 0;
  const H = headerH + gap + statsH + gap + propsH + gap + footerH;

  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = primary;
  ctx.fillRect(0,0,W,headerH);
  ctx.fillStyle = onPrimary;
  ctx.font = "700 52px Roboto, sans-serif";
  ctx.fillText("myTenants", margin, 96);
  ctx.font = "500 32px Roboto, sans-serif";
  ctx.globalAlpha = 0.92;
  ctx.fillText(fmtMonth(data.mk) + " summary", margin, 148);
  ctx.globalAlpha = 1;

  let y = headerH + gap;
  function statTile(x, yy, w, h, label, value){
    ctx.fillStyle = surfaceVariant;
    roundRectPath(ctx, x, yy, w, h, 18);
    ctx.fill();
    ctx.fillStyle = inkSoft;
    ctx.font = "500 22px Roboto, sans-serif";
    ctx.fillText(label, x+24, yy+40);
    ctx.fillStyle = ink;
    ctx.font = "700 40px Roboto, sans-serif";
    ctx.fillText(value, x+24, yy+h-28);
  }
  const tileH = (statsH - 20) / 2;
  statTile(margin, y, colW, tileH, "Collected this month", fmtMoney(data.collected));
  statTile(margin+colW+20, y, colW, tileH, "Arrears as of month end", fmtMoney(data.arrears));
  statTile(margin, y+tileH+20, colW, tileH, "Cash in hand (unsettled)", fmtMoney(data.cashTotal));
  statTile(margin+colW+20, y+tileH+20, colW, tileH, "Tenants paid", `${data.paidCount} / ${data.totalTenants}`);
  y += statsH + gap;

  if (data.byProperty.length){
    ctx.fillStyle = ink;
    ctx.font = "700 30px Roboto, sans-serif";
    ctx.fillText("By property", margin, y+8);
    y += propHeaderH;
    for (const p of data.byProperty){
      ctx.strokeStyle = line;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(margin, y+propRowH-1); ctx.lineTo(W-margin, y+propRowH-1); ctx.stroke();

      ctx.fillStyle = ink;
      ctx.font = "600 30px Roboto, sans-serif";
      ctx.fillText(truncateCanvasText(ctx, p.property.name, W - margin*2 - 260), margin, y+38);

      ctx.fillStyle = inkSoft;
      ctx.font = "400 22px Roboto, sans-serif";
      ctx.fillText(`${p.paid} paid · ${p.partial} partial · ${p.due} due`, margin, y+70);

      ctx.textAlign = 'right';
      ctx.fillStyle = ink;
      ctx.font = "700 30px Roboto, sans-serif";
      ctx.fillText(fmtMoney(p.collected), W-margin, y+44);
      ctx.textAlign = 'left';

      y += propRowH;
    }
  }

  ctx.fillStyle = inkSoft;
  ctx.font = "400 20px Roboto, sans-serif";
  ctx.textAlign = 'center';
  ctx.fillText(`Generated ${fmtDate(todayISO())} · myTenants`, W/2, H-36);
  ctx.textAlign = 'left';
}
function roundRectPath(ctx,x,y,w,h,r){
  if (ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); return; }
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function truncateCanvasText(ctx, text, maxWidth){
  if (ctx.measureText(text).width <= maxWidth) return text;
  let t = text;
  while (t.length>1 && ctx.measureText(t+"…").width > maxWidth) t = t.slice(0,-1);
  return t + "…";
}

async function buildMonthlyReportData(mk){
  const [collected, cashRows, monthlyStatuses, portfolio, trend, defaulters, partnerSettlement, transfersAll] = await Promise.all([
    Repo.totalCollectedForMonth(mk), Repo.cashInHandByReceiver(), Repo.monthlyStatusForAllTenants(mk),
    Repo.portfolioTotals(), Repo.monthlyCollections(6, mk), Repo.defaultersAsOf(mk),
    Repo.reportPartnerSettlementSummary(mk), Repo.transferHistory()
  ]);
  const outstandingTotal = defaulters.reduce((s,t)=>s+t.current_balance,0);
  const cashTotal = cashRows.reduce((s,r)=>s+r.amount,0);
  const paidCount = monthlyStatuses.filter(s=>s.status==="paid").length;
  const partialCount = monthlyStatuses.filter(s=>s.status==="partial").length;
  const dueCount = monthlyStatuses.filter(s=>s.status==="due").length;

  const byPropMap = {};
  for (const t of defaulters){
    const key = t.property ? t.property.name : "Unknown property";
    byPropMap[key] = (byPropMap[key]||0) + t.current_balance;
  }
  const outstandingByProperty = Object.entries(byPropMap).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value);

  const propMap = {};
  for (const row of monthlyStatuses){
    const pname = row.property ? row.property.name : "Unknown property";
    (propMap[pname] ||= []).push(row);
  }
  const propertyDetail = Object.entries(propMap)
    .map(([name, rows]) => ({ name, rows: rows.sort((a,b)=>a.tenant.name.localeCompare(b.tenant.name)) }))
    .sort((a,b)=>a.name.localeCompare(b.name));

  const transfersThisPeriod = transfersAll.filter(t=>t.period===mk);

  return { mk, collected, outstandingTotal, cashTotal, cashRows, paidCount, partialCount, dueCount, portfolio, trend, defaulters, outstandingByProperty, propertyDetail, partnerSettlement, transfersThisPeriod };
}

function apCollectReceivers(total_amount){

  const tenant_id = document.getElementById("ap-tenant").value;
