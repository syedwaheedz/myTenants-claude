name: Android tag & release

# Runs after every merge to main. version.json is the single source of truth
# for "this is a stable release" — an ordinary merge that doesn't touch it
# just relies on android-ci.yml having already validated the PR; nothing is
# tagged or released. Bumping version.json in a PR is what cuts a release.
on:
  push:
    branches: ["main"]

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare version.json against latest tag
        id: check
        run: |
          VERSION=$(node -pe "require('./version.json').version")
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "version.json version: $VERSION"
          echo "latest tag: ${LATEST_TAG:-<none>}"
          if [ "v$VERSION" = "$LATEST_TAG" ]; then
            echo "No version bump — skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # See android-ci.yml — the action's default "tools" package is
          # discontinued upstream and fails the step outright.
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Build web assets for the Android shell
        run: npm run build:android-www

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore

      - name: Assemble signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Remove keystore from disk
        if: always()
        run: rm -f android/release.keystore

      - name: Tag the release
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          gh release create "v$VERSION" "$APK" \
            --title "myTenants v$VERSION" \
            --generate-notes
