name: App tests

# Unit/regression tests for the web app's business logic (rent status,
# partner settlement, snapshot, PDF/backup export) — runs against the real
# index.html in a headless browser. Independent of the Android build/release
# workflows; a failure here doesn't block them, it's a visibility check.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
